<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>KAYANI POS</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2A1E16">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KAYANI">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts.css">
<style>
/* Mise en page : barre latérale espresso + plan de travail sable clair ; palette tirée du compte Instagram KAYANI (sable, caramel, bronze, espresso, mousse) */
:root{
  --bg:#F3ECE1; --surface:#FBF7F0; --sand:#E9DECD; --sand-2:#DCCBB3; --line:#DDCFBA;
  --ink:#2E2119; --muted:#7A6654; --sage:#B58B62; --sage-deep:#4A3426; --sage-tint:#EFE3D1;
  --terra:#9C6237; --terra-tint:#F0DFCC;
  --good:#5D7745; --good-tint:#E3E8D6; --warn:#A5711C; --warn-tint:#F3E5C9; --crit:#A2412F; --crit-tint:#F3DBD3;
  --side:#2A1E16; --side-ink:#F1E7D8; --side-muted:#B9A38A;
  --shadow:0 1px 2px rgba(46,33,25,.06),0 6px 24px rgba(46,33,25,.07);
  --f-display:'Marcellus','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --f-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16100C; --surface:#1F1712; --sand:#2A2019; --sand-2:#352920; --line:#3B2E24;
  --ink:#EFE4D4; --muted:#B39F89; --sage:#C69C72; --sage-deep:#DDBD94; --sage-tint:#33261C;
  --terra:#D38E5C; --terra-tint:#3A281B;
  --good:#9DB77F; --good-tint:#252D1C; --warn:#DDB15A; --warn-tint:#372B17; --crit:#E2836F; --crit-tint:#3B221C;
  --side:#0F0A07; --side-ink:#EFE4D4; --side-muted:#A28D76;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16100C; --surface:#1F1712; --sand:#2A2019; --sand-2:#352920; --line:#3B2E24;
  --ink:#EFE4D4; --muted:#B39F89; --sage:#C69C72; --sage-deep:#DDBD94; --sage-tint:#33261C;
  --terra:#D38E5C; --terra-tint:#3A281B;
  --good:#9DB77F; --good-tint:#252D1C; --warn:#DDB15A; --warn-tint:#372B17; --crit:#E2836F; --crit-tint:#3B221C;
  --side:#0F0A07; --side-ink:#EFE4D4; --side-muted:#A28D76;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 24px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.nw{white-space:nowrap}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:26px} h2{font-size:19px} h3{font-size:16px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
a{color:var(--sage-deep)}
:focus-visible{outline:2px solid var(--terra);outline-offset:2px}

/* Shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:4px;padding:20px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand img{width:38px;height:38px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.login-logo{width:88px;height:88px;border-radius:50%;margin-bottom:16px}
.brand b{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.14em}
.brand small{display:block;font-size:10px;letter-spacing:.12em;color:var(--side-muted);text-transform:uppercase}
.nav-group{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted);padding:14px 12px 4px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;border:0;background:none;color:var(--side-ink);text-align:left;cursor:pointer;width:100%;font-size:14px}
.nav svg{width:18px;height:18px;flex:none;opacity:.85}
.nav:hover{background:rgba(255,255,255,.07)}
.nav.on{background:rgba(255,255,255,.12);box-shadow:inset 3px 0 0 var(--terra)}
.nav .lock{margin-left:auto;width:14px;height:14px;opacity:.6}
.side-foot{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.1);display:grid;gap:8px;font-size:12.5px}
.who{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:#B58B62;color:#2A1E16;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.topbar .grow{flex:1;min-width:0}
.menu-btn{display:none}
.demo-band{background:var(--terra-tint);color:var(--ink);font-size:12.5px;padding-block:7px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--terra)}
.content{padding-block:24px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:20px;align-content:start}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--muted);max-width:62ch}

/* Composants */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--sage)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--sage-deep);border-color:var(--sage-deep);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.terra{background:var(--terra);border-color:var(--terra);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--crit);border-color:var(--crit-tint)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:999px;cursor:pointer;font-size:13px}
.chip.on{background:var(--sage-deep);color:var(--surface);border-color:var(--sage-deep)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-good{background:var(--good-tint);color:var(--good)} .p-warn{background:var(--warn-tint);color:var(--warn)}
.p-crit{background:var(--crit-tint);color:var(--crit)} .p-neutral{background:var(--sand);color:var(--muted)} .p-sage{background:var(--sage-tint);color:var(--sage-deep)}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
.input:focus{border-color:var(--sage);outline:none;box-shadow:0 0 0 3px var(--sage-tint)}
.search{position:relative}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search .input{padding-left:34px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.note{font-size:12.5px;color:var(--muted)}
.alert{border-radius:10px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.alert.warn{background:var(--warn-tint)} .alert.crit{background:var(--crit-tint)} .alert.info{background:var(--sage-tint)}
.alert b{font-weight:600}

/* Tableaux */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--sand)}
.pager{display:flex;justify-content:space-between;align-items:center;padding-top:12px;font-size:13px;color:var(--muted)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:4px;align-content:start}
.kpi .v{font-size:22px;font-weight:600;letter-spacing:-.01em}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi .tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.delta.up{color:var(--good)} .delta.down{color:var(--crit)}
.kpi.ops{background:var(--sage-tint);border-color:transparent}
.dash{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.toplist{display:grid;gap:10px}
.toplist .it{display:grid;gap:4px}
.bar{height:6px;border-radius:3px;background:var(--sand)}
.bar i{display:block;height:100%;border-radius:3px;background:var(--sage)}
.bar.terra i{background:var(--terra)}

/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:16px;align-items:start}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.item{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;text-align:left;cursor:pointer;display:grid;gap:6px;align-content:start;min-height:108px}
.item:hover{border-color:var(--sage);box-shadow:var(--shadow)}
.item[disabled]{opacity:.45;cursor:not-allowed}
.item .n{font-weight:600;font-size:13.5px;line-height:1.3}
.item .m{font-size:12px;color:var(--muted)}
.item .p{font-weight:700;margin-top:auto}
.cart{position:sticky;top:76px;display:grid;gap:14px;grid-column:2;grid-row:1 / span 2}
.cline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px}
.qty button{border:0;background:none;width:28px;height:28px;cursor:pointer;font-size:16px}
.qty span{min-width:22px;text-align:center}
.disc{width:64px;padding:4px 6px;font-size:12.5px}
.totals{display:grid;gap:6px}
.totals .spread{font-size:13.5px}
.totals .grand{font-size:20px;font-weight:700;padding-top:8px;border-top:1px solid var(--line)}
.paylist{display:grid;gap:6px}
.payrow{display:flex;justify-content:space-between;align-items:center;background:var(--sand);border-radius:8px;padding:6px 10px;font-size:13px}

/* Agenda */
.agenda-wrap{overflow-x:auto}
.agenda{display:grid;grid-template-columns:56px repeat(3,minmax(190px,1fr));min-width:640px;position:relative}
.ag-col{position:relative;border-left:1px solid var(--line)}
.ag-head{position:sticky;top:0;background:var(--surface);padding:8px 10px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);font-weight:600;font-size:13px}
.ag-hour{font-size:11px;color:var(--muted);text-align:right;padding-right:8px;transform:translateY(-7px)}
.ag-line{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.ag-ev{position:absolute;left:6px;right:6px;border-radius:8px;padding:6px 8px;font-size:12px;cursor:pointer;overflow:hidden;border:1px solid;display:grid;gap:1px;align-content:start}
.ag-ev b{font-size:12.5px}
.ev-corps{background:var(--v-corps-t);border-color:var(--v-corps);border-left-width:4px}
.ev-thera{background:var(--v-thera-t);border-color:var(--v-thera);border-left-width:4px}
.ev-club{background:var(--v-club-t);border-color:var(--v-club);border-left-width:4px}
.ev-off{background:repeating-linear-gradient(135deg,var(--sand),var(--sand) 6px,var(--surface) 6px,var(--surface) 12px);border-color:var(--line);color:var(--muted)}
.ev-cancel{opacity:.5;text-decoration:line-through}
.now-line{position:absolute;left:0;right:0;border-top:2px solid var(--terra);z-index:2}

/* Modale */
.overlay{position:fixed;inset:0;background:rgba(20,26,22,.45);z-index:50;display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:calc(100vh - 48px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{width:min(780px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-b{padding:18px 20px;display:grid;gap:14px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow);max-width:min(420px,calc(100vw - 40px))}
.toast.err{background:var(--crit);color:#fff}

/* Document (reçu / facture) */
.paper{background:#FCF8F1;color:#2E2119;border:1px solid #DDCFBA;border-radius:6px;padding:24px;font-size:13px}
.paper h2{font-family:var(--f-display);letter-spacing:.16em;color:#4A3426}
.paper table td,.paper table th{border-color:#E6DACA;color:#2E2119}
.paper .ph{color:#9C6237;font-style:italic}

/* Volets d'activité : une couleur par volet, partagée par la caisse, le ticket et l'agenda */
:root{--v-corps:#3F6E6B;--v-corps-t:#E1ECEA;--v-thera:#8A4F75;--v-thera-t:#F2E2EC;--v-club:#B0721A;--v-club-t:#F6E7CF;--v-herbo:#5D7745;--v-herbo-t:#E5EBDA;--v-autre:#7A6654;--v-autre-t:#EDE5DA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--v-corps:#86BDB8;--v-corps-t:#1C2B2A;--v-thera:#D69BC2;--v-thera-t:#2E1C28;--v-club:#E2AE5C;--v-club-t:#33260F;--v-herbo:#A6C487;--v-herbo-t:#222B19;--v-autre:#B39F89;--v-autre-t:#2A2019}}
:root[data-theme="dark"]{--v-corps:#86BDB8;--v-corps-t:#1C2B2A;--v-thera:#D69BC2;--v-thera-t:#2E1C28;--v-club:#E2AE5C;--v-club-t:#33260F;--v-herbo:#A6C487;--v-herbo-t:#222B19;--v-autre:#B39F89;--v-autre-t:#2A2019}
.v-corps{--vc:var(--v-corps);--vt:var(--v-corps-t)} .v-thera{--vc:var(--v-thera);--vt:var(--v-thera-t)} .v-club{--vc:var(--v-club);--vt:var(--v-club-t)} .v-herbo{--vc:var(--v-herbo);--vt:var(--v-herbo-t)} .v-autre{--vc:var(--v-autre);--vt:var(--v-autre-t)}
.item[class*="v-"]{background:var(--vt);border-color:color-mix(in srgb,var(--vc) 35%,transparent);border-left:5px solid var(--vc)}
.item[class*="v-"]:hover{border-color:var(--vc)}
.item[class*="v-"] .eyebrow{color:var(--vc)}
.chip .dot,.vdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--vc);margin-right:6px;vertical-align:baseline}
.chip.on[class*="v-"]{background:var(--vc);border-color:var(--vc);color:#fff}
.chip.on[class*="v-"] .dot{background:#fff}
.cline[class*="v-"]{border-left:4px solid var(--vc);padding-left:10px}
.vtag{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:12.5px;background:var(--vt);color:var(--vc);font-weight:600}
.vtag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.volets{display:flex;flex-wrap:wrap;gap:8px}
.sync-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.sync-pill i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.sync-pill.off i{background:var(--warn)} .sync-pill.err i{background:var(--crit)} .sync-pill.busy i{background:var(--sage);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.splash{min-height:100vh;display:grid;place-items:center;background:var(--side);color:var(--side-ink)}
.update-band{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--sage-deep);color:var(--surface);padding:10px 14px;border-radius:12px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);font-size:13.5px}
@media (max-width:520px){.sync-pill span{display:none}}
.cash-mini{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* Connexion */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.login-art{background:radial-gradient(120% 90% at 85% 100%,rgba(181,139,98,.35),transparent 60%),var(--side);color:var(--side-ink);padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art h1{font-size:44px;letter-spacing:.2em}
.login-art p{max-width:40ch;color:var(--side-muted)}
.login-art svg.rings{position:absolute;right:-120px;bottom:-120px;width:520px;opacity:.18}
.login-form{display:grid;place-items:center;padding:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-box{width:min(400px,100%);display:grid;gap:16px}
.role-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role-card{border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:var(--surface);text-align:left;display:grid;gap:4px}
.role-card.on{border-color:var(--sage-deep);box-shadow:0 0 0 2px var(--sage-tint)}
.role-card small{color:var(--muted);font-size:12px}

.toggle{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.switch{width:40px;height:22px;border-radius:11px;background:var(--sand-2);border:0;position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch.on{background:var(--sage-deep)} .switch.on::after{left:21px}
.steps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:13px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}

@media (max-width:1100px){.dash,.split{grid-template-columns:minmax(0,1fr)} .pos{grid-template-columns:minmax(0,1fr)} .cart{position:static;grid-column:auto;grid-row:2}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s;height:100%;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}
  .menu-btn{display:inline-flex}
  .login{grid-template-columns:minmax(0,1fr)} .login-art{padding:28px 20px;min-height:auto} .login-art h1{font-size:32px}
  .grid3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .topbar,.content,.demo-band{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (max-width:520px){.topbar .pill{display:none} .grid2,.grid3,.role-pick{grid-template-columns:minmax(0,1fr)} h1{font-size:22px} .kpi .v{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Calculs ---------- */
/* Avances clients : argent reçu avant la prestation, conservé comme solde à valoir */
const advUsed=a=>a.uses.reduce((x,u)=>x+u.amount,0);
const advRefunded=a=>a.refunds.reduce((x,u)=>x+u.amount,0);
const advBal=a=>a.amount-advUsed(a)-advRefunded(a);
function advStatus(a){const b=advBal(a);if(b<=0)return advUsed(a)>0?'utilisée':'remboursée';return advUsed(a)+advRefunded(a)>0?'partiellement utilisée':'disponible'}
const clientAdvs=cid=>S.advances.filter(a=>a.clientId===cid&&advBal(a)>0).sort((a,b)=>a.date.localeCompare(b.date));
const clientAdvBal=cid=>cid?clientAdvs(cid).reduce((x,a)=>x+advBal(a),0):0;
function consumeAdvance(cid,amount,sale){let left=amount;const ids=[];for(const a of clientAdvs(cid)){if(left<=0)break;const t=Math.min(left,advBal(a));a.uses.push({date:TODAY,saleId:sale.id,saleNo:sale.no,amount:t});left-=t;ids.push(a.no)}return ids}
/* Encaissements = paiements reçus (hors utilisation d'avance, déjà encaissée) + avances reçues − avances remboursées */
function encIn(r,user='tous'){const u=x=>user==='tous'||x.user===user;
 return S.payments.filter(p=>p.method!==ADV&&inRange(p.date,r)&&u(p)).reduce((a,p)=>a+p.amount,0)
  +S.advances.filter(a=>inRange(a.date,r)&&u(a)).reduce((x,a)=>x+a.amount,0)
  -S.advances.reduce((x,a)=>x+a.refunds.filter(f=>inRange(f.date,r)&&u(f)).reduce((y,f)=>y+f.amount,0),0)}
const isFree=s=>s.price===0;
const svcMeta=s=>s.sessions?`${s.sessions} séances × ${s.dur>=60?(s.dur/60).toLocaleString('fr-FR')+' h':s.dur+' min'}`:(s.dur?(s.dur>=60?(s.dur/60).toLocaleString('fr-FR')+' h':s.dur+' min'):s.type);
const priceTxt=s=>s.price===0?'Gratuit':fmtM(s.price);
const paidFor=saleId=>S.payments.filter(p=>p.saleId===saleId).reduce((a,p)=>a+p.amount,0);
const liveSales=()=>S.sales.filter(s=>s.status!=='annulée');
const inRange=(d,r)=>d>=r.from&&d<=r.to;
function range(p){
 const t=TODAY; const first=t.slice(0,8)+'01'; const day=+t.slice(8,10);
 if(p==='jour') return {from:t,to:t,pf:addDays(t,-1),pt:addDays(t,-1),label:'Aujourd\'hui',plabel:'hier'};
 if(p==='7j') return {from:addDays(t,-6),to:t,pf:addDays(t,-13),pt:addDays(t,-7),label:'7 derniers jours',plabel:'7 jours précédents'};
 if(p==='30j') return {from:addDays(t,-29),to:t,pf:addDays(t,-59),pt:addDays(t,-30),label:'30 derniers jours',plabel:'30 jours précédents'};
 const pf=addDays(first,-1).slice(0,8)+'01'; return {from:first,to:t,pf,pt:addDays(pf,day-1),label:'Ce mois-ci',plabel:'même période du mois dernier'};
}
function linesIn(r,{cat='toutes',user='tous'}={}){
 const out=[]; liveSales().forEach(s=>{ if(!inRange(s.date,r)) return; if(user!=='tous'&&s.user!==user) return; s.lines.forEach(l=>{ if(cat!=='toutes'&&l.cat!==cat) return; out.push({...l,sale:s}) }) }); return out;
}
const sumLines=ls=>ls.reduce((a,l)=>a+lineHT(l),0); // chiffre d'affaires = HT
const cashTheo=c=>c.opening+c.moves.reduce((a,m)=>a+m.amount,0);
const memberLeft=m=>m.included-m.used;
function invStatus(inv){
 if(inv.status==='brouillon'||inv.status==='annulée') return inv.status;
 const s=S.sales.find(x=>x.id===inv.saleId); const paid=paidFor(s.id);
 if(paid>=s.total) return 'payée'; if(inv.due<TODAY) return 'en retard'; if(paid>0) return 'partiellement payée'; return 'émise';
}

function niceStep(max){const raw=max/4;const p=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}

/* --- Caisse POS --- */
function posTotals(){const sub=ui.pos.cart.reduce((a,l)=>a+l.unit*l.qty,0);const total=docTotal(ui.pos.cart);const paid=ui.pos.pays.reduce((a,p)=>a+p.amount,0);return{sub,disc:sub-total,total,paid,rest:total-paid}}

 const P=ui.pos; const q=P.q.trim().toLowerCase();
 const all=[...S.services.filter(s=>s.active).map(s=>({k:'S',id:s.id,name:s.name,cat:s.cat,price:s.price,pack:!!s.sessions,pt:priceTxt(s),meta:svcMeta(s)+' · '+staffName(s.staff)})),
  ...S.products.map(p=>({k:'P',id:p.id,name:p.name,cat:'Herboristerie',price:p.price,stock:p.stock,pt:p.price?fmtM(p.price):'Prix à renseigner',meta:!p.price?'Non vendable':p.stock>0?'Stock : '+p.stock:'Rupture',sku:p.sku,bar:p.bar}))];
 const cats=['Tout','Soins du corps','Thérapie','Clubs','Packs et cycles','Herboristerie'];

   <div class="num" style="font-weight:600;text-align:right">${fmtM(lineTotal(l))}</div>
   <div class="row" style="gap:8px"><span class="qty"><button data-a="qty" data-i="${i}" data-d="-1" aria-label="Diminuer">−</button><span class="num">${l.qty}</span><button data-a="qty" data-i="${i}" data-d="1" aria-label="Augmenter">+</button></span>
    <label class="note" for="disc-${i}">Remise %</label><input class="input disc num" id="disc-${i}" data-in="disc" data-i="${i}" value="${l.disc||''}" inputmode="decimal" placeholder="0"></div>

 const overDisc=!isAdmin()&&P.cart.some(l=>l.disc>S.perms.discountMax);
 const advAvail=P.clientId?clientAdvBal(P.clientId)-P.pays.filter(p=>p.method===ADV).reduce((a,p)=>a+p.amount,0):0;
 if(P.method===ADV&&clientAdvBal(P.clientId)<=0)P.method='Espèces';
 return `
 <div class="pos">
  <div class="card" style="display:grid;gap:14px">
   <div class="search">${ic('search')}<input class="input" id="pos-q" data-in="posq" placeholder="Rechercher par nom, SKU ou code-barres" value="${esc(P.q)}" autocomplete="off"></div>

     <span class="eyebrow" style="font-size:10px">${esc(i.cat)}</span><span class="n">${esc(i.name)}</span><span class="m">${esc(i.meta)}</span><span class="p num">${i.pt}</span></button>`).join('')||'<p class="note">Aucun article ne correspond.</p>'}</div>
  </div>
  ${advancesCard()}

   <div class="card" style="display:grid;gap:12px">

     <div class="field"><label for="pos-due">Solde attendu le</label><input class="input" id="pos-due" type="date" data-in="posdue" value="${P.due||addDays(TODAY,7)}" min="${TODAY}"></div></div>`:''}

    ${advAvail>0?`<div class="alert info"><span><b>${esc(cname(P.clientId))}</b> dispose de ${fmtM(clientAdvBal(P.clientId))} d'avance. Choisissez « Avance client » pour la déduire de cette vente.</span></div>`:''}
    <div class="row" style="flex-wrap:nowrap"><input class="input num" id="pos-amount" data-in="posamount" inputmode="decimal" placeholder="${toInput(Math.max(T.rest,0))}" value="${esc(P.amount)}"><button class="btn" data-a="addpay" ${T.rest<=0||!P.cart.length?'disabled':''}>Ajouter</button></div>
    <div class="paylist">${P.pays.map((p,i)=>`<div class="payrow"><span>${p.method}</span><span class="row" style="gap:6px"><b class="num">${fmtM(p.amount)}</b><button class="btn ghost sm" data-a="rmpay" data-i="${i}" aria-label="Retirer">${ic('x')}</button></span></div>`).join('')}</div>
    <div class="spread num" style="font-size:15px"><span>${T.rest>=0?'Reste à payer':'Monnaie à rendre'}</span><b style="color:${T.rest>0?'var(--terra)':'var(--good)'}">${fmtM(Math.abs(T.rest))}</b></div>
    ${(P.mode==='avance'||(T.rest>0&&P.pays.length))&&!P.clientId?'<div class="alert warn"><span>Une vente avec avance nécessite un client identifié pour suivre le solde dû.</span></div>':''}
    ${P.mode==='avance'&&P.cart.length&&!P.pays.length?'<div class="note">Ajoutez le montant de l\'avance reçue, ou utilisez un raccourci 30 % / 50 %.</div>':''}
    <button class="btn terra" id="pos-validate" style="justify-content:center;padding:12px;font-size:15px" data-a="validate" ${!P.cart.length||overDisc||P.busy||(T.rest>0&&!P.clientId)||(!P.pays.length&&T.total>0&&!P.clientId)||(P.mode==='avance'&&(!P.pays.length||!P.clientId))?'disabled':''}>${P.busy?'Enregistrement…':P.mode==='avance'&&T.rest>0?'Enregistrer la vente avec avance de '+fmtM(T.paid):T.rest>0&&P.pays.length?'Valider avec acompte':T.rest>0?'Valider sans paiement (créance)':'Valider la vente'}</button>
    <div class="note">Un double clic ne crée pas deux ventes : chaque panier porte une clé unique et le bouton se verrouille pendant l'enregistrement.</div>
   </div>
   ${cashMini()}
  </div>
 </div>`;
}
function cashMini(){const c=S.cash;return `<div class="card cash-mini"><div><h3>Tiroir-caisse</h3><div class="note">${c?`Ouvert à ${c.openTime} par ${esc(userName(c.user))} · solde espèces <b class="num">${fmtM(cashTheo(c))}</b>`:'Fermé : ouvrez-le pour encaisser des espèces'}</div></div><div class="row">${c?`<button class="btn sm" data-a="modal" data-m="cashMove">Entrée ou sortie</button><button class="btn sm terra" data-a="modal" data-m="closeCash">Clôturer</button>`:`<button class="btn sm primary" data-a="modal" data-m="openCash">Ouvrir la caisse</button>`}</div></div>`}
function openAdvances(){return liveSales().filter(s=>s.clientId&&s.total-paidFor(s.id)>0&&!S.invoices.some(i=>i.saleId===s.id&&i.status!=='annulée')).sort((a,b)=>(a.dueDate||a.date).localeCompare(b.dueDate||b.date))}
function advancesCard(){const rows=openAdvances();return `<div class="card" style="grid-column:1/2"><div class="card-h"><div><h3>Ventes à solder</h3><div class="note">Ventes enregistrées avec un acompte, dont le reste est à encaisser</div></div><span class="pill ${rows.length?'p-warn':'p-neutral'}">${rows.length}</span></div>
 <div class="tbl-wrap"><table><thead><tr><th>Vente</th><th>Client</th><th class="r">Total TTC</th><th class="r">Avance reçue</th><th class="r">Reste</th><th>Solde attendu</th><th></th></tr></thead><tbody>
 ${rows.map(s=>{const paid=paidFor(s.id);const late=s.dueDate&&s.dueDate<TODAY;return `<tr><td class="num"><b>${s.no}</b><div class="note">${fmtD(s.date)} · ${esc(s.lines.map(l=>l.name).join(', '))}</div></td><td>${esc(cname(s.clientId))}</td><td class="r num">${fmtM(s.total)}</td><td class="r num">${fmtM(paid)}</td><td class="r num" style="font-weight:600;color:var(--terra)">${fmtM(s.total-paid)}</td><td class="num">${s.dueDate?fmtD(s.dueDate):'—'}${late?' <span class="pill p-crit">En retard</span>':''}</td><td><button class="btn sm primary" data-a="modal" data-m="paySale" data-id="${s.id}">Encaisser le solde</button></td></tr>`}).join('')||'<tr><td colspan="7" class="muted">Aucune avance en attente de solde.</td></tr>'}
 </tbody></table></div></div>`}
function memberHint(cid){const ms=S.memberships.filter(m=>m.clientId===cid&&m.end>=TODAY&&memberLeft(m)>0);if(!ms.length)return'';return `<div class="alert info"><span>${ms.map(m=>`<b>${esc(svc(m.serviceId).name)}</b> : ${memberLeft(m)} séance${memberLeft(m)>1?'s':''} restante${memberLeft(m)>1?'s':''}, jusqu'au ${fmtD(m.end)}`).join('<br>')}</span></div>`}

 const head=`<div class="head"><div><h1>Catalogue</h1><p>Prestations et produits de l'herboristerie, vendus dans le même panier.${can('catalogEdit')?'':' Consultation seule pour votre profil.'}</p></div>

  ${rows.map(s=>`<tr class="${can('catalogEdit')?'click':''}" ${can('catalogEdit')?`data-a="modal" data-m="editService" data-id="${s.id}"`:''}><td class="num muted">${s.ref}</td><td><b>${esc(s.name)}</b><div class="note">${esc(s.desc)}</div></td><td class="v-${volet(s.cat)}"><span class="vdot"></span>${s.cat}</td><td>${s.type}${s.cap?` · ${s.cap} pl.`:''}${s.sessions?` · ${s.sessions} séances / ${s.days} j`:''}</td><td class="r num">${s.dur?s.dur+' min':'—'}</td><td class="r num">${priceTxt(s)}</td>${isAdmin()?`<td class="r num muted">${s.cost?fmtM(s.cost):'<span style="color:var(--warn)">À saisir</span>'}</td><td class="r num">${s.cost&&s.price?pct(s.price-s.cost,s.price).toLocaleString('fr-FR')+' %':'—'}</td>`:''}<td>${staffName(s.staff)} · ${s.room||'—'}</td><td>${s.active?(s.bookable?pill('confirmé').replace('Confirmé','Réservable'):pill('confirmé').replace('Confirmé','Actif')):'<span class="pill p-neutral">Archivé</span>'}</td></tr>`).join('')}</tbody></table>`;
 } else if(t==='produits'){
  const rows=S.products.filter(p=>!q||(p.name+p.sku+p.cat+p.supplier+p.bar).toLowerCase().includes(q));
  body=`<table><thead><tr><th>SKU</th><th>Produit</th><th>Catégorie</th><th>Fournisseur</th>${isAdmin()?'<th class="r">Achat</th>':''}<th class="r">Vente</th>${isAdmin()?'<th class="r">Marge</th>':''}<th class="r">Stock</th><th>Lot · péremption</th><th>État</th>${can('stock')?'<th></th>':''}</tr></thead><tbody>
  ${rows.map(p=>{const st=!p.price?'<span class="pill p-warn">À compléter</span>':p.stock<=0?'<span class="pill p-crit">Rupture</span>':p.stock<=p.thr?'<span class="pill p-warn">Stock faible</span>':'<span class="pill p-good">En stock</span>';const exp=p.expiry&&p.expiry<=addDays(TODAY,30);
  return `<tr><td class="num muted">${p.sku}${p.bar?`<div class="note">${p.bar}</div>`:''}</td><td><b>${esc(p.name)}</b></td><td>${p.cat}</td><td>${esc(p.supplier)}</td>${isAdmin()?`<td class="r num muted">${fmtM(p.buy)}</td>`:''}<td class="r num">${p.price?fmtM(p.price):'<span style="color:var(--warn)">À saisir</span>'}</td>${isAdmin()?`<td class="r num">${p.price&&p.buy?pct(p.price-p.buy,p.price).toLocaleString('fr-FR')+' %':'—'}</td>`:''}<td class="r num"><b>${p.stock}</b><div class="note">seuil ${p.thr}</div></td><td>${p.lot||'—'}<div class="note" style="${exp?'color:var(--warn);font-weight:600':''}">${p.expiry?fmtD(p.expiry):'Sans date'}</div></td><td>${st}</td>${can('stock')?`<td><div class="row" style="flex-wrap:nowrap;gap:6px"><button class="btn sm" data-a="modal" data-m="editProduct" data-id="${p.id}">Modifier</button><button class="btn sm" data-a="modal" data-m="stockMove" data-id="${p.id}">Mouvement</button></div></td>`:''}</tr>`}).join('')}</tbody></table>

 } else {
  const rows=[...S.stockMoves].reverse().filter(m=>!q||(prd(m.pid).name+m.reason+m.type).toLowerCase().includes(q));

 }
 return head+`<div class="card"><div class="card-h"><div class="search" style="width:min(360px,100%)">${ic('search')}<input class="input" id="cat-q" data-in="catq" placeholder="Rechercher" value="${esc(ui.cat.q)}"></div></div><div class="tbl-wrap">${body}</div></div>`;
}

/* --- Clients --- */
function clientStats(c){const sales=liveSales().filter(s=>s.clientId===c.id);const visits=new Set(sales.map(s=>s.date));S.bookings.filter(b=>b.clientId===c.id&&b.status==='honoré').forEach(b=>visits.add(b.date));const last=[...visits].sort().pop()||'';const next=S.bookings.filter(b=>b.clientId===c.id&&b.date>=TODAY&&b.status==='confirmé').map(b=>b.date).sort()[0]||'';const due=sales.reduce((a,s)=>a+Math.max(0,s.total-paidFor(s.id)),0);const spent=sales.reduce((a,s)=>a+s.total,0);return{sales,visits:visits.size,last,next,due,spent}}
function viewClients(){
 const q=ui.cli.q.toLowerCase(),seg=ui.cli.seg;
 let rows=S.clients.map(c=>({c,st:clientStats(c)}));
 const bdaySoon=c=>{if(!c.birth)return false;for(let i=0;i<30;i++){if(addDays(TODAY,i).slice(5)===c.birth.slice(5))return true}return false};
 rows=rows.filter(({c,st})=>(!q||(c.first+' '+c.last+c.phone+c.email).toLowerCase().includes(q))&&(seg==='tous'||(seg==='reg'&&st.visits>=6)||(seg==='inactifs'&&(!st.last||st.last<addDays(TODAY,-45)))||(seg==='anniv'&&bdaySoon(c))||(seg==='solde'&&st.due>0)||(seg==='nouveaux'&&c.created>=addDays(TODAY,-30))||(seg==='avance'&&clientAdvBal(c.id)>0)));
 const per=8,pages=Math.max(1,Math.ceil(rows.length/per));ui.cli.page=Math.min(ui.cli.page,pages);const slice=rows.slice((ui.cli.page-1)*per,ui.cli.page*per);
 const segs=[['tous','Tous'],['reg','Réguliers'],['nouveaux','Nouveaux (30 j)'],['inactifs','Inactifs (45 j)'],['anniv','Anniversaire < 30 j'],['solde','Solde dû'],['avance','Avance disponible']];
 return `<div class="head"><div><h1>Clients</h1><p>Fiche commerciale uniquement : aucune note thérapeutique ni donnée de santé n'est enregistrée ici.</p></div><button class="btn primary" data-a="modal" data-m="newClient">${ic('plus')}Nouveau client</button></div>

 :`<div class="card"><div class="card-h"><div><h2>Caisse fermée</h2><div class="note">Ouvrez la caisse avec le fonds initial compté pour encaisser des espèces.</div></div><button class="btn primary" data-a="modal" data-m="openCash">Ouvrir la caisse</button></div></div>`;
 const moves=c?`<div class="card"><h3 style="margin-bottom:10px">Mouvements de la session</h3><div class="tbl-wrap"><table><thead><tr><th>Heure</th><th>Type</th><th>Motif</th><th>Utilisateur</th><th class="r">Montant</th></tr></thead><tbody>${[...c.moves].reverse().map(m=>`<tr><td class="num">${m.time}</td><td>${m.type}</td><td>${esc(m.reason)}</td><td>${userName(m.user)}</td><td class="r num" style="color:${m.amount<0?'var(--crit)':'var(--good)'}">${m.amount>0?'+':''}${fmtM(m.amount)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Aucun mouvement.</td></tr>'}</tbody></table></div></div>`:'';

 const q=ui.exp.q.toLowerCase();const E=ui.exp;

 const expSum=exps.reduce((a,e)=>a+e.amount,0);
 const expTbl=`<div class="card"><div class="card-h"><div><h2>Registre des dépenses</h2><div class="note">${isAdmin()?'Dépenses importées du suivi des charges 2026, plus les nouvelles saisies':'Vos saisies uniquement'}</div></div><div class="row">${can('expense')?`<button class="btn primary" data-a="modal" data-m="expense">${ic('plus')}Nouvelle dépense</button>`:`<button class="btn" data-a="denied" data-label="Saisie des dépenses">${ic('lock')}Nouvelle dépense</button>`}</div></div>
 <div class="row" style="margin-bottom:12px"><div class="search" style="width:min(260px,100%)">${ic('search')}<input class="input" id="exp-q" data-in="expq" placeholder="Fournisseur, catégorie, détail" value="${esc(E.q)}"></div>

  <div class="chips" role="group" aria-label="Type de charge">${[['tous','Toutes'],['Fixe','Fixes'],['Variable','Variables']].map(([k,l])=>`<button class="chip ${E.axe===k?'on':''}" data-a="expaxe" data-x="${k}">${l}</button>`).join('')}</div>

 ${exps.map(e=>`<tr><td class="num">${fmtD(e.date)}${e.dateEst||e.note?`<div class="note" style="color:var(--warn)">${esc(e.note||'Date à confirmer')}</div>`:''}</td><td class="num nw">${e.no}<div class="note">${esc(e.piece)}</div></td><td>${e.axe?`<span class="pill ${e.axe==='Fixe'?'p-sage':'p-neutral'}">${e.axe}</span>`:'—'}</td><td>${esc(e.cat)}</td><td>${esc(e.desc)}</td><td>${esc(e.payee)}</td><td>${e.method}<div class="note">${e.account}</div></td><td class="r num nw">${fmtM(e.amount)}</td><td>${e.justif?esc(e.justif):e.attach?'Joint':'<span style="color:var(--warn)">Sans justificatif</span>'}</td><td>${pill(e.status)}</td>${can('validateExpense')?`<td>${e.status==='à valider'?`<button class="btn sm" data-a="valexp" data-id="${e.id}">Valider</button>`:''}</td>`:''}</tr>`).join('')||'<tr><td colspan="10" class="muted">Aucune dépense.</td></tr>'}</tbody></table></div></div>`;
 let charges='';
 if(isAdmin()){const yr=S.expenses.filter(e=>e.date.startsWith(TODAY.slice(0,4)));const byMonth=months.filter(m=>m.startsWith(TODAY.slice(0,4))).map(m=>{const es=yr.filter(e=>e.date.startsWith(m));const f=es.filter(e=>e.axe==='Fixe').reduce((a,e)=>a+e.amount,0);const v=es.filter(e=>e.axe!=='Fixe').reduce((a,e)=>a+e.amount,0);return{m,f,v,t:f+v}});
  const mx=Math.max(...byMonth.map(x=>x.t),1);const tot=yr.reduce((a,e)=>a+e.amount,0);const full=byMonth.filter(x=>x.m<TODAY.slice(0,7));const avg=full.length?Math.round(full.reduce((a,x)=>a+x.t,0)/full.length):0;
  const cats={};yr.forEach(e=>{cats[e.cat]=(cats[e.cat]||0)+e.amount});const topC=Object.entries(cats).sort((a,b)=>b[1]-a[1]);const cmx=topC[0]?topC[0][1]:1;

 let finance='';
 if(isAdmin()){const r=range('mois');const ls=linesIn(r);const ca=sumLines(ls);const cogs=ls.filter(l=>l.kind==='P').reduce((a,l)=>a+lineCost(l),0);const svcCost=ls.filter(l=>l.kind==='S').reduce((a,l)=>a+lineCost(l),0);const enc=encIn(r);const dep=S.expenses.filter(e=>inRange(e.date,r)).reduce((a,e)=>a+e.amount,0);const depOps=S.expenses.filter(e=>inRange(e.date,r)&&e.cat!=='Achats de marchandises').reduce((a,e)=>a+e.amount,0);const cre=liveSales().reduce((a,s)=>a+Math.max(0,s.total-paidFor(s.id)),0);const gm=ca-cogs-svcCost;
 const row=(l,v,note='')=>`<div class="spread"><span>${l}${note?`<div class="note">${note}</div>`:''}</span><b class="num">${fmtM(v)}</b></div>`;

 <div class="spread grand" style="font-size:16px"><span>Marge brute estimée</span><span class="num">${fmtM(gm)}</span></div>
 ${row('− Charges d\'exploitation',-depOps,'Dépenses du mois hors achats de marchandises')}
 <div class="spread grand" style="font-size:16px"><span>Résultat opérationnel estimatif</span><span class="num">${fmtM(gm-depOps)}</span></div></div>
 <div class="totals">${row('Encaissements TTC',enc,'Argent reçu, avances comprises, TVA comprise')}${row('Avances clients à valoir',S.advances.reduce((x,a)=>x+advBal(a),0),'Reçues mais pas encore consommées : à servir en prestations')}${row('TVA collectée',ls.reduce((a,l)=>a+lineTVA(l),0),'À reverser, sur les ventes du mois')}${row('Dépenses payées',dep,'Toutes catégories')}${row('Créances clients',cre,'À date, toutes périodes')}${row('Dettes fournisseurs',0,'Module non activé')}
 <div class="alert info" style="margin-top:8px"><span>Ces chiffres sont des indicateurs de gestion. Ils ne remplacent pas un résultat comptable certifié par votre expert-comptable.</span></div></div></div></div>`}

}

function viewAgenda(){
 const d=ui.agenda.date;const H0=9*60,H1=20*60,PX=1.1;
 const bks=S.bookings.filter(b=>b.date===d);
 const cols=STAFF.map(st=>{const evs=bks.filter(b=>b.staff===st.id).map(b=>{const s=b.serviceId?svc(b.serviceId):null;const cls=!s?'ev-off':s.cat==='Thérapie'?'ev-thera':s.cat==='Clubs'?'ev-club':'ev-corps';
  return `<div class="ag-ev ${cls} ${b.status==='annulé'?'ev-cancel':''}" style="top:${(b.start-H0)*PX}px;height:${b.dur*PX-3}px" data-a="modal" data-m="booking" data-id="${b.id}" role="button" tabindex="0"><span class="num muted">${hm(b.start)}–${hm(b.start+b.dur)}</span><b>${s?esc(s.name):esc(b.title)}</b><span>${s?(s.type==='Collective'?b.size+' / '+s.cap+' inscrits':esc(cname(b.clientId))):'Source : Google Calendar'}</span>${b.status!=='confirmé'&&b.status!=='externe'?`<span>${pill(b.status)}</span>`:''}</div>`}).join('');
  let lines='';for(let m=H0;m<=H1;m+=60)lines+=`<div class="ag-line" style="top:${(m-H0)*PX}px"></div>`;
  const now=d===TODAY&&nowMin()>H0&&nowMin()<H1?`<div class="now-line" style="top:${(nowMin()-H0)*PX}px"></div>`:'';
  return `<div class="ag-col" style="height:${(H1-H0)*PX}px">${lines}${now}${evs}</div>`}).join('');
 let hours='';for(let m=H0;m<=H1;m+=60)hours+=`<div class="ag-hour num" style="position:absolute;top:${(m-H0)*PX}px;right:0">${hm(m)}</div>`;
 const dLabel=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'}).format(new Date(d+'T12:00:00Z'));
 const ms=S.memberships.map(m=>`<tr><td>${esc(cname(m.clientId))}</td><td>${esc(svc(m.serviceId).name)}</td><td class="num">${fmtD(m.start)} → ${fmtD(m.end)}</td><td class="r num">${m.used} / ${m.included}</td><td>${memberLeft(m)<=0?'<span class="pill p-neutral">Épuisé</span>':m.end<=addDays(TODAY,7)?'<span class="pill p-warn">Expire bientôt</span>':'<span class="pill p-good">Actif</span>'}</td></tr>`).join('');
 return `<div class="head"><div><h1>Agenda</h1><p>KAYANI contrôle les disponibilités, les salles et les capacités. Google Calendar n'est qu'un miroir.</p></div><div class="row"><button class="btn sm" data-a="agday" data-d="-1" aria-label="Jour précédent">${ic('chev')}</button><button class="btn sm" data-a="agday" data-d="0">Aujourd'hui</button><button class="btn sm" data-a="agday" data-d="1" aria-label="Jour suivant">${ic('chevr')}</button><b style="text-transform:capitalize;min-width:170px">${dLabel}</b><button class="btn primary" data-a="modal" data-m="newBooking">${ic('plus')}Rendez-vous</button></div></div>
 <div class="alert warn"><span>${ic('sync','')}</span><span><b>Google Calendar non connecté · mode démonstration.</b> Les rendez-vous restent dans KAYANI. Le bloc hachuré illustre un événement importé depuis Google, qui rend l'intervenant indisponible. ${isAdmin()?'<a href="#" data-a="go" data-v="parametres">Voir les étapes de connexion</a>':''}</span></div>
 <div class="card" style="padding:0;overflow:hidden"><div class="agenda-wrap"><div class="agenda"><div></div>${STAFF.map(s=>`<div class="ag-head">${s.name}<div class="note" style="font-weight:400">${s.spec}</div></div>`).join('')}
 <div style="position:relative;height:${(H1-H0)*PX}px">${hours}</div>${cols}</div></div></div>
 <div class="card"><div class="card-h"><h3>Clubs, abonnements et forfaits</h3><span class="note">Séances consommées automatiquement à chaque présence</span></div><div class="tbl-wrap"><table><thead><tr><th>Client</th><th>Formule</th><th>Validité</th><th class="r">Séances</th><th>État</th></tr></thead><tbody>${ms}</tbody></table></div></div>`;

/* --- Rapports --- */
function reportData(type,r){
 if(type==='ventes'){const m={};linesIn(r).forEach(l=>{const d=l.sale.date;m[d]=m[d]||{n:new Set(),ca:0,cost:0};m[d].n.add(l.sale.id);m[d].ca+=lineHT(l);m[d].cost+=lineCost(l)});const rows=Object.keys(m).sort().map(d=>[fmtD(d),m[d].n.size,fmtM(m[d].ca),fmtM(m[d].ca-m[d].cost)]);return{cols:['Date','Ventes','CA HT','Marge brute estimée'],rows}}
 if(type==='depenses'){const m={};S.expenses.filter(e=>inRange(e.date,r)).forEach(e=>{m[e.cat]=(m[e.cat]||0)+e.amount});const tot=Object.values(m).reduce((a,b)=>a+b,0);return{cols:['Catégorie','Montant','Part'],rows:Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[k,fmtM(v),pct(v,tot).toLocaleString('fr-FR')+' %'])}}
 if(type==='impayes'){return{cols:['Document','Client','Date','Total','Payé','Solde'],rows:liveSales().filter(s=>s.total>paidFor(s.id)).map(s=>{const inv=S.invoices.find(i=>i.saleId===s.id);return[inv?inv.no:s.no,cname(s.clientId),fmtD(s.date),fmtM(s.total),fmtM(paidFor(s.id)),fmtM(s.total-paidFor(s.id))]})}}
 if(type==='stock'){return{cols:['SKU','Produit','Stock','Seuil','Valeur achat','Péremption'],rows:S.products.map(p=>[p.sku,p.name,p.stock,p.thr,fmtM(p.stock*p.buy),p.expiry?fmtD(p.expiry):'—'])}}
 if(type==='prestations'){const m={};linesIn(r).filter(l=>l.kind==='S').forEach(l=>{m[l.name]=m[l.name]||{q:0,ca:0,c:0};m[l.name].q+=l.qty;m[l.name].ca+=lineHT(l);m[l.name].c+=lineCost(l)});return{cols:['Prestation','Quantité','CA HT','Prix moyen HT','Marge estimée'],rows:Object.entries(m).sort((a,b)=>b[1].ca-a[1].ca).map(([k,o])=>[k,o.q,fmtM(o.ca),fmtM(Math.round(o.ca/o.q)),pct(o.ca-o.c,o.ca).toLocaleString('fr-FR')+' %'])}}
 if(type==='charges'){const ms=[...new Set(S.expenses.filter(e=>inRange(e.date,r)).map(e=>e.date.slice(0,7)))].sort();return{cols:['Mois','Charges fixes','Charges variables','Total','Lignes'],rows:ms.map(m=>{const es=S.expenses.filter(e=>e.date.startsWith(m)&&inRange(e.date,r));const f=es.filter(e=>e.axe==='Fixe').reduce((a,e)=>a+e.amount,0);const t=es.reduce((a,e)=>a+e.amount,0);return[m.slice(5)+'/'+m.slice(0,4),fmtM(f),fmtM(t-f),fmtM(t),es.length]})}}
 if(type==='avances'){return{cols:['N°','Date','Client','Objet','Reçu','Utilisé','Remboursé','Disponible','Statut'],rows:S.advances.filter(a=>inRange(a.date,r)||advBal(a)>0).map(a=>[a.no,fmtD(a.date),cname(a.clientId),a.purpose,fmtM(a.amount),fmtM(advUsed(a)),fmtM(advRefunded(a)),fmtM(advBal(a)),advStatus(a)])}}
 if(type==='intervenants'){return{cols:['Intervenant','RDV honorés','Annulés ou absents','Minutes réservées'],rows:STAFF.map(s=>{const b=S.bookings.filter(x=>x.staff===s.id&&inRange(x.date,r)&&x.serviceId);return[s.name,b.filter(x=>x.status==='honoré').length,b.filter(x=>['annulé','absent'].includes(x.status)).length,b.filter(x=>x.status!=='annulé').reduce((a,x)=>a+x.dur,0)]})}}
}
function insights(){
 const r=range('30j');const ls=linesIn(r).filter(l=>l.kind==='S');const m={};ls.forEach(l=>{m[l.name]=m[l.name]||{ca:0,c:0};m[l.name].ca+=lineHT(l);m[l.name].c+=lineCost(l)});
 const out=[];const low=Object.entries(m).map(([k,o])=>[k,o.ca,pct(o.ca-o.c,o.ca)]).sort((a,b)=>a[2]-b[2])[0];
 if(low) out.push(`<b>${esc(low[0])}</b> a la marge estimée la plus faible des prestations vendues sur 30 jours (${low[2].toLocaleString('fr-FR')} % pour ${fmtM(low[1])} de CA). Vérifiez le coût saisi ou le prix.`);
 const slow=S.products.filter(p=>p.stock>0&&!linesIn(r).some(l=>l.refId===p.id));slow.forEach(p=>out.push(`<b>${esc(p.name)}</b> : aucune vente sur 30 jours pour ${p.stock} unités en stock (${fmtM(p.stock*p.buy)} immobilisés).`));
 const closed=S.quotes.filter(x=>['accepté','converti','refusé','expiré'].includes(x.status));out.push(`Devis : ${closed.filter(x=>['accepté','converti'].includes(x.status)).length} acceptés sur ${closed.length} clôturés. L'échantillon est trop petit pour conclure.`);
 return out;
}
function viewRapports(){
 const types=[['ventes','Ventes quotidiennes'],['prestations','Performance des prestations'],['depenses','Dépenses par catégorie'],['charges','Charges par mois'],['avances','Avances clients'],['impayes','Factures et ventes impayées'],['stock','État du stock'],['intervenants','Activité par intervenant']];
 const r=ui.rep.period==='annee'?{from:TODAY.slice(0,4)+'-01-01',to:TODAY}:range(ui.rep.period);const d=reportData(ui.rep.type,r);
 const csv=[d.cols,...d.rows].map(row=>row.map(c=>{const s=String(c).replace(/ | /g,' ');return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(';')).join('\n');
 return `<div class="head"><div><h1>Rapports</h1><p>Calculés à partir des transactions enregistrées dans le prototype. Les exports PDF et Excel seront générés côté serveur en phase 3 ; ici, copiez le CSV.</p></div></div>
 <div class="card" style="display:grid;gap:12px"><h3>Pistes d'amélioration</h3>${insights().map(t=>`<div class="alert info"><span>${t}</span></div>`).join('')}<div class="note">Ces constats décrivent des écarts dans les chiffres, pas leurs causes.</div></div>
 <div class="card"><div class="card-h"><div class="chips">${types.map(([k,l])=>`<button class="chip ${ui.rep.type===k?'on':''}" data-a="reptype" data-t="${k}">${l}</button>`).join('')}</div>
 <div class="chips">${[['jour','Jour'],['7j','7 jours'],['mois','Mois'],['30j','30 jours'],['annee','Depuis janvier']].map(([k,l])=>`<button class="chip ${ui.rep.period===k?'on':''}" data-a="repperiod" data-p="${k}">${l}</button>`).join('')}</div></div>
 <div class="tbl-wrap"><table><thead><tr>${d.cols.map((c,i)=>`<th class="${i?'r':''}">${c}</th>`).join('')}</tr></thead><tbody>${d.rows.map(row=>`<tr>${row.map((c,i)=>`<td class="${i?'r num':''}">${esc(c)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${d.cols.length}" class="muted">Aucune donnée sur la période.</td></tr>`}</tbody></table></div>
 <div style="display:grid;gap:8px;margin-top:16px"><div class="spread"><label class="field" for="csv-out" style="font-weight:600;color:var(--muted);font-size:12.5px">Export CSV (séparateur point-virgule)</label><button class="btn sm" data-a="copycsv">${ic('copy')}Copier</button></div><textarea class="input num" id="csv-out" rows="6" readonly>${esc(csv)}</textarea></div></div>`;
}

function paperDoc(kind,no,date,clientId,lines,extra=''){
 const s=S.settings;const tot=docTotal(lines);
 return `<div class="paper"><div class="spread" style="align-items:flex-start;margin-bottom:16px"><div><h2>KAYANI</h2><div style="font-size:12px">${esc(s.name)}<br>${s.address?esc(s.address):'<span class="ph">Adresse à renseigner</span>'}<br>MF : ${s.mf?esc(s.mf):'<span class="ph">à renseigner</span>'} · RC : ${s.rc?esc(s.rc):'<span class="ph">à renseigner</span>'}</div></div><div style="text-align:right"><div style="font-weight:700;letter-spacing:.08em;text-transform:uppercase">${kind}</div><div class="num">${no}</div><div class="num">${fmtD(date)}</div></div></div>

/* ---------- Rendu ---------- */
const VIEWS={dashboard:viewDashboard,pos:viewPOS,avances:viewAvances,catalogue:viewCatalogue,clients:viewClients,documents:viewDocuments,caisse:viewCaisse,agenda:viewAgenda,rapports:viewRapports,parametres:viewParametres,journal:viewJournal};
function render(){
 const ae=document.activeElement;const fid=ae&&ae.id;let ss=null,se=null;try{ss=ae.selectionStart;se=ae.selectionEnd}catch(e){}
 const app=document.getElementById('app');
 if(!ui.user){app.innerHTML=viewLogin()}else{
  if(!canView(ui.view)) ui.view='pos';
  app.innerHTML=shell(VIEWS[ui.view]())+viewModal()}
 if(ui.toast) app.insertAdjacentHTML('beforeend',`<div class="toast ${ui.toast.err?'err':''}" role="status">${esc(ui.toast.msg)}</div>`);
 if(fid){const el=document.getElementById(fid);if(el){el.focus();try{if(ss!==null)el.setSelectionRange(ss,se)}catch(e){}}}
 if(ui.user)Store.persist();
 renderStatus();
}
const val=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
const showErr=(id,msg)=>{const el=document.getElementById(id);if(el)el.innerHTML=`<div class="alert crit"><span>${esc(msg)}</span></div>`};
const overlap=(a1,d1,a2,d2)=>a1<a2+d2&&a2<a1+d1;
function bookingConflict(b,ignoreId){
 const s=svc(b.serviceId);
 if(b.start<9*60||b.start+b.dur>20*60) return 'Hors des horaires d\'ouverture (09:00–20:00).';
 if(dow(b.date)===0) return 'Le centre est fermé le dimanche.';
 const same=S.bookings.filter(x=>x.id!==ignoreId&&x.date===b.date&&x.status!=='annulé'&&overlap(b.start,b.dur,x.start,x.dur));
 const st=same.find(x=>x.staff===b.staff);if(st) return `${staffName(b.staff)} est déjà occupé·e de ${hm(st.start)} à ${hm(st.start+st.dur)}${st.serviceId?'':' (événement Google)'}.`;
 if(b.room){const rm=same.find(x=>x.room===b.room);if(rm) return `La salle « ${b.room} » est déjà réservée de ${hm(rm.start)} à ${hm(rm.start+rm.dur)}.`}
 if(b.clientId){const cl=same.find(x=>x.clientId===b.clientId);if(cl) return `${cname(b.clientId)} a déjà un rendez-vous à ${hm(cl.start)}.`}
 return null;
}

/* ---------- Actions ---------- */
const A={
 loginRole:d=>{ui.login.role=d.role;render()},
 logout:async()=>{if(Store.PROD){try{await Store.signOut()}catch(e){toast(e.message,true);return}location.reload();return}ui.user=null;ui.modal=null;ui.nav=false;render()},
 syncnow:()=>{Store.sync();toast(navigator.onLine?'Synchronisation lancée.':'Hors ligne : les opérations sont gardées sur cet appareil.',!navigator.onLine)},
 nav:()=>{ui.nav=!ui.nav;render()},
 go:d=>{if(!canView(d.v)){toast('Accès réservé à l\'administrateur.',true);return}ui.view=d.v;ui.modal=null;ui.nav=false;render();window.scrollTo(0,0)},
 denied:d=>toast(`« ${d.label} » est réservé à l'administrateur ou nécessite une permission.`,true),
 modal:d=>{ui.modal={type:d.m,id:d.id,from:d.from};render()},
 closeModal:()=>{ui.modal=null;render()},
 closeModalBg:(d,el,e)=>{if(e.target===el){ui.modal=null;render()}},
 period:d=>{ui.period=d.p;render()},
 poscat:d=>{ui.pos.cat=d.c;render()},
 add:d=>{const P=ui.pos;const ex=P.cart.find(l=>l.kind===d.k&&l.refId===d.id);if(d.k==='P'){const p=prd(d.id);const inCart=ex?ex.qty:0;if(inCart+1>p.stock){toast(`Stock insuffisant : ${p.stock} disponible${p.stock>1?'s':''}.`,true);return}}
  if(ex) ex.qty++; else P.cart.push(mkLine(d.k,d.id));if(!P.key)P.key=uid('cart');render()},
 qty:d=>{const l=ui.pos.cart[+d.i];const n=l.qty+ +d.d;if(n<1){ui.pos.cart.splice(+d.i,1)}else{if(l.kind==='P'&&n>prd(l.refId).stock){toast('Stock insuffisant.',true);return}l.qty=n}render()},
 rmline:d=>{ui.pos.cart.splice(+d.i,1);render()},
 clearcart:()=>{Object.assign(ui.pos,{cart:[],pays:[],amount:'',key:null,mode:'complet',due:''});render()},
 paymethod:d=>{ui.pos.method=d.m;render()},
 paymode:d=>{ui.pos.mode=d.m;if(d.m==='avance'&&!ui.pos.due)ui.pos.due=addDays(TODAY,7);render()},
 advpct:d=>{const T=posTotals();const amt=Math.round(T.total*(+d.p)/100/1000)*1000;ui.pos.pays=[{method:ui.pos.method,amount:Math.min(amt,T.total)}];ui.pos.amount='';render()},
 doPaySale:d=>{const s=S.sales.find(x=>x.id===d.id);const due=s.total-paidFor(s.id);const amt=parseM(val('ps-amount'));const method=val('ps-method');
  if(S.payments.some(p=>p.key===d.key)){showErr('ps-err','Ce paiement a déjà été enregistré.');return}
  if(isNaN(amt)||amt<=0){showErr('ps-err','Saisissez un montant positif.');return}if(amt>due){showErr('ps-err',`Le montant dépasse le reste à payer (${fmtM(due)}).`);return}

  S.expenses.push(e);if(method==='Espèces'){const cm={id:uid('M'),time:hm(nowMin()),type:'Dépense',amount:-amt,reason:'Dépense '+e.no+' : '+desc,ref:e.id,user:ui.user.id};S.cash.moves.push(cm);e.cashMoveId=cm.id}
  log('Dépense saisie',`${e.no} · ${e.cat} · ${fmtM(amt)}`);ui.modal=null;toast(`Dépense ${e.no} enregistrée${method==='Espèces'?', déduite une seule fois de la caisse':''}.`)},
 valexp:d=>{const e=S.expenses.find(x=>x.id===d.id);e.status='validée';log('Dépense validée',e.no);toast(`Dépense ${e.no} validée.`)},
 bstatus:d=>{const b=S.bookings.find(x=>x.id===d.id);b.status=d.s;log('Rendez-vous '+d.s,`${svc(b.serviceId).name} · ${fmtD(b.date)} ${hm(b.start)}`);ui.modal=null;toast('Rendez-vous '+d.s+'.')},
 moveBooking:d=>{const b=S.bookings.find(x=>x.id===d.id);const [h,mi]=val('bm-time').split(':').map(Number);const nb={...b,start:h*60+mi,date:val('bm-date')};const err=bookingConflict(nb,b.id);if(err){showErr('bm-err',err);return}
  log('Rendez-vous déplacé',`${svc(b.serviceId).name} : ${fmtD(b.date)} ${hm(b.start)} → ${fmtD(nb.date)} ${hm(nb.start)}`);Object.assign(b,{start:nb.start,date:nb.date});ui.modal=null;ui.agenda.date=nb.date;toast('Rendez-vous déplacé.')},
 enroll:d=>{const b=S.bookings.find(x=>x.id===d.id);const s=svc(b.serviceId);if(b.size>=s.cap){showErr('bm-err',`Séance complète (${s.cap} places). Le participant peut être placé en liste d'attente.`);return}b.size++;log('Inscription club',`${s.name} · ${fmtD(b.date)} : ${b.size}/${s.cap}`);render()},
 checkout:d=>{const b=S.bookings.find(x=>x.id===d.id);b.status='honoré';const ms=S.memberships.find(m=>{const ps=svc(m.serviceId);return m.clientId===b.clientId&&m.end>=TODAY&&memberLeft(m)>0&&(ps.covers||[ps.id]).includes(b.serviceId)});
  if(ms){ms.used++;log('Séance consommée',`${cname(b.clientId)} · ${svc(ms.serviceId).name} : ${memberLeft(ms)} restantes`);ui.modal=null;toast(`Séance décomptée du forfait : ${memberLeft(ms)} restante${memberLeft(ms)>1?'s':''}.`);return}
  Object.assign(ui.pos,{cart:[mkLine('S',b.serviceId)],clientId:b.clientId||'',pays:[],key:uid('cart')});ui.modal=null;ui.view='pos';render()},
 saveBooking:()=>{const sid=val('nb-service');const s=svc(sid);const [h,mi]=val('nb-time').split(':').map(Number);const b={id:uid('R'),date:val('nb-date'),start:h*60+mi,dur:s.dur,serviceId:sid,staff:val('nb-staff')||s.staff,room:val('nb-room')||s.room,clientId:val('nb-client'),status:'confirmé',sync:'demo',size:1};
  if(!b.staff){showErr('nb-err','Choisissez un intervenant.');return}
  if(s.type==='Collective'){const sess=S.bookings.find(x=>x.serviceId===sid&&x.date===b.date&&x.start===b.start&&x.status!=='annulé');if(sess){if(sess.size>=s.cap){showErr('nb-err',`Séance complète (${s.cap} places).`);return}sess.size++;log('Inscription club',`${s.name} · ${fmtD(b.date)}`);ui.modal=null;ui.agenda.date=b.date;toast(`Inscription ajoutée : ${sess.size}/${s.cap}.`);return}}
  const err=bookingConflict(b);if(err){showErr('nb-err',err);return}
  S.bookings.push(b);log('Rendez-vous créé',`${s.name} · ${cname(b.clientId)} · ${fmtD(b.date)} ${hm(b.start)}`);ui.modal=null;ui.agenda.date=b.date;toast('Rendez-vous réservé. Synchronisation Google : mode démo, non envoyé.')},
};
const INPUT={
 posq:v=>{ui.pos.q=v},posdue:v=>{ui.pos.due=v;return false},posclient:v=>{ui.pos.clientId=v;ui.pos.pays=ui.pos.pays.filter(p=>p.method!==ADV);if(ui.pos.method===ADV)ui.pos.method='Espèces'},posamount:v=>{ui.pos.amount=v;return false},
 disc:(v,el)=>{const n=Math.max(0,Math.min(100,parseFloat(v.replace(',','.'))||0));ui.pos.cart[+el.dataset.i].disc=n},
 catq:v=>{ui.cat.q=v},advq:v=>{ui.adv.q=v},expmonth:v=>{ui.exp.month=v},nasvc:(v)=>{const el=document.getElementById('na-purpose');const am=document.getElementById('na-amount');if(v&&el&&!el.value)el.value=svc(v).name;if(v&&am&&!am.value)am.value=toInput(svc(v).price);return false},cliq:v=>{ui.cli.q=v;ui.cli.page=1},docsq:v=>{ui.docs.q=v},expq:v=>{ui.exp.q=v},
 fcat:v=>{ui.fcat=v},fuser:v=>{ui.fuser=v},
 set:(v,el)=>{S.settings[el.dataset.k]=v;return false},
 tva:(v,el)=>{S.settings.tva[el.dataset.k]=v;return false},
 'disc-max':v=>{const n=parseInt(v);if(n>=0&&n<=100)S.perms.discountMax=n;return false},
 cccount:v=>{ui.modal.count=v},ccreason:v=>{ui.modal.reason=v;return false},
};

document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;if(a.tagName==='A')e.preventDefault();const fn=A[a.dataset.a];if(fn&&!a.disabled)fn(a.dataset,a,e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;render()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.ag-ev')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(!k||!INPUT[k])return;const r=INPUT[k](e.target.value,e.target);if(r!==false)render()});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.in;if(k&&['set','tva','disc-max'].includes(k))log('Paramètre modifié',k+(e.target.dataset.k?' · '+e.target.dataset.k:''))});
document.addEventListener('submit',e=>{if(e.target.id==='login-form'&&Store.PROD){e.preventDefault();doLogin();return}if(e.target.id==='login-form'){e.preventDefault();ui.user=USERS[ui.login.role];ui.view=ui.user.role==='admin'?'dashboard':'pos';ui.pos.method='Espèces';log('Connexion','Session ouverte (simulée)');render()}});
function renderStatus(){const el=document.getElementById('sync-pill');if(!el)return;const st=Store.state;
 const cls=st.syncing?'busy':!navigator.onLine?'off':st.error?'err':'';
 const t=st.syncing?'Synchronisation…':!navigator.onLine?`Hors ligne${st.pending?' · '+st.pending+' en attente':''}`:st.error?'Erreur de synchro':st.pending?st.pending+' en attente':st.lastSync?'À jour '+st.lastSync.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'Connexion…';
 el.className='sync-pill '+cls;el.innerHTML=`<i></i><span>${esc(t)}</span>`;el.title=st.error||'Synchroniser maintenant'}
function rebuildDerived(){
 const stock={};(S.stockMoves||[]).forEach(m=>{stock[m.pid]=(stock[m.pid]||0)+m.qty});(S.products||[]).forEach(p=>p.stock=stock[p.id]||0);
 const open=(S.cashSessions||[]).filter(c=>!c.closing).sort((a,b)=>(b.opened+b.openTime).localeCompare(a.opened+a.openTime));S.cash=open[0]||null;
 S.cashHistory=(S.cashSessions||[]).filter(c=>c.closing).sort((a,b)=>b.closing.at.localeCompare(a.closing.at)).map(c=>({opened:c.opened,user:c.closing.user,opening:c.opening,theo:c.closing.theo,counted:c.closing.counted,gap:c.closing.gap,reason:c.closing.reason}));
 (S.audit||[]).sort((a,b)=>b.at.localeCompare(a.at));
}
let deferred=false;
Store.hooks.rebuild=rebuildDerived;
Store.hooks.status=renderStatus;
Store.hooks.changed=()=>{if(ui.modal||document.activeElement&&document.activeElement.matches('input,textarea,select')){deferred=true;return}render()};
document.addEventListener('focusout',()=>{if(deferred&&!ui.modal){deferred=false;setTimeout(render,50)}});
const _closeModal=A.closeModal;A.closeModal=()=>{_closeModal();if(deferred){deferred=false;render()}};
async function enter(p){
 ui.user={id:p.id,name:p.name,short:(p.name||p.email).split(/[\s.@]+/).filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join(''),role:p.role,email:p.email};
 ui.view=p.role==='admin'?'dashboard':'pos';
 document.getElementById('app').innerHTML='<div class="splash"><div style="text-align:center"><img src="'+LOGO+'" alt="" style="width:96px;border-radius:50%"><p>Chargement des données…</p></div></div>';
 await Store.start(S);render();
}
async function doLogin(){const email=val('lg-email'),pass=document.getElementById('lg-pass').value;ui.login.email=email;
 if(!email||!pass){ui.login.err='Saisissez votre e-mail et votre mot de passe.';render();return}
 if(!navigator.onLine){ui.login.err='Pas de connexion Internet : la première connexion sur cet appareil en demande une.';render();return}
 ui.login.busy=true;ui.login.err='';render();
 try{const p=await Store.signIn(email,pass);ui.login.busy=false;await enter(p)}
 catch(e){ui.login.busy=false;ui.login.err=/Invalid login/i.test(e.message)?'E-mail ou mot de passe incorrect.':/fetch|network|Load failed/i.test(e.message)?'Impossible de joindre le serveur KAYANI. Vérifiez la connexion Internet puis réessayez.':/Email not confirmed/i.test(e.message)?'Adresse e-mail non confirmée : cochez « Auto Confirm User » dans Supabase ou confirmez le compte.':e.message;render()}}
async function boot(){
 if(!Store.PROD){render();return}
 document.getElementById('app').innerHTML='<div class="splash"><img src="'+LOGO+'" alt="KAYANI" style="width:96px;border-radius:50%"></div>';
 try{const p=await Store.restore();if(p){await enter(p);return}}catch(e){console.warn(e)}
 render();
}
// Une application restée ouverte d'un jour sur l'autre se recharge pour repartir sur la bonne date
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(new Date())!==TODAY&&!ui.modal)location.reload()});
// Application installable : service worker (cache hors ligne) et avis de mise à jour
if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('sw.js').then(reg=>{
 const show=w=>{if(document.querySelector('.update-band'))return;const b=document.createElement('div');b.className='update-band';b.innerHTML='Nouvelle version de KAYANI disponible <button class="btn sm">Mettre à jour</button>';b.querySelector('button').onclick=()=>{w.postMessage('skipWaiting')};document.body.appendChild(b)};
 if(reg.waiting)show(reg.waiting);
 reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)show(w)})});
 const hadController=!!navigator.serviceWorker.controller;let reloading=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadController||reloading)return;reloading=true;Store.flush().finally(()=>location.reload())});
}).catch(e=>console.warn('SW',e))}
boot();
