function viewAgenda(){
 const d=ui.agenda.date;const H0=9*60,H1=20*60,PX=1.1;
 const bks=S.bookings.filter(b=>b.date===d);
 const cols=STAFF.map(st=>{const evs=bks.filter(b=>b.staff===st.id).map(b=>{const s=b.serviceId?svc(b.serviceId):null;const cls=!s?'ev-off':s.cat==='Thérapie'?'ev-thera':s.cat==='Clubs'?'ev-club':'ev-corps';
  const gs=gcalState(b);return `<div class="ag-ev ${cls} ${b.status==='annulé'?'ev-cancel':''} ${['err','conf'].includes(gs.k)?'ev-warn':''}" title="Google Agenda : ${gs.label}" style="top:${(b.start-H0)*PX}px;height:${b.dur*PX-3}px" data-a="modal" data-m="booking" data-id="${b.id}" role="button" tabindex="0"><span class="num muted">${hm(b.start)}–${hm(b.start+b.dur)}</span><b>${s?esc(s.name):esc(b.title)}</b><span>${s?(s.type==='Collective'?b.size+' / '+s.cap+' inscrits':esc(cname(b.clientId))):'Source : Google Calendar'}</span>${b.status!=='confirmé'&&b.status!=='externe'?`<span>${pill(b.status)}</span>`:''}${(()=>{const g=gcalState(b);return ['err','conf','link'].includes(g.k)?`<span><span class="pill ${g.cls}">${g.label}</span></span>`:''})()}</div>`}).join('');
  let lines='';for(let m=H0;m<=H1;m+=60)lines+=`<div class="ag-line" style="top:${(m-H0)*PX}px"></div>`;
  const now=d===TODAY&&nowMin()>H0&&nowMin()<H1?`<div class="now-line" style="top:${(nowMin()-H0)*PX}px"></div>`:'';
  return `<div class="ag-col" style="height:${(H1-H0)*PX}px">${lines}${now}${evs}</div>`}).join('');
 let hours='';for(let m=H0;m<=H1;m+=60)hours+=`<div class="ag-hour num" style="position:absolute;top:${(m-H0)*PX}px;right:0">${hm(m)}</div>`;
 const dLabel=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'}).format(new Date(d+'T12:00:00Z'));
 const ms=S.memberships.map(m=>`<tr><td>${esc(cname(m.clientId))}</td><td>${esc(svc(m.serviceId).name)}</td><td class="num">${fmtD(m.start)} → ${fmtD(m.end)}</td><td class="r num">${m.used} / ${m.included}</td><td>${memberLeft(m)<=0?'<span class="pill p-neutral">Épuisé</span>':m.end<=addDays(TODAY,7)?'<span class="pill p-warn">Expire bientôt</span>':'<span class="pill p-good">Actif</span>'}</td></tr>`).join('');
 return `<div class="head"><div><h1>Agenda</h1><p>KAYANI contrôle les disponibilités, les salles et les capacités. Les rendez-vous se synchronisent avec Google Agenda dans les deux sens.</p></div><div class="row"><button class="btn sm" data-a="agday" data-d="-1" aria-label="Jour précédent">${ic('chev')}</button><button class="btn sm" data-a="agday" data-d="0">Aujourd'hui</button><button class="btn sm" data-a="agday" data-d="1" aria-label="Jour suivant">${ic('chevr')}</button><b style="text-transform:capitalize;min-width:170px">${dLabel}</b><button class="btn primary" data-a="modal" data-m="newBooking">${ic('plus')}Rendez-vous</button></div></div>
 ${gcalBanner()}
 ${(()=>{const L=toLink(d);return L.length?`<div class="card"><div class="card-h"><h3>Événements Google à relier · ${L.length}</h3><span class="note">Créés dans Google Agenda sans prestation reconnue. Ils ne bloquent aucun créneau tant qu'ils ne sont pas reliés.</span></div><div class="toplist">${L.map(b=>`<div class="spread"><span><b class="num">${hm(b.start)}–${hm(b.start+b.dur)}</b> · ${esc(b.title||'Événement Google')}</span><button class="btn sm" data-a="modal" data-m="linkGoogle" data-id="${b.id}">Relier</button></div>`).join('')}</div></div>`:''})()}
 <div class="card" style="padding:0;overflow:hidden"><div class="agenda-wrap"><div class="agenda"><div></div>${STAFF.map(s=>`<div class="ag-head">${s.name}<div class="note" style="font-weight:400">${s.spec}</div></div>`).join('')}
 <div style="position:relative;height:${(H1-H0)*PX}px">${hours}</div>${cols}</div></div></div>
 <div class="card"><div class="card-h"><h3>Clubs, abonnements et forfaits</h3><span class="note">Séances consommées automatiquement à chaque présence</span></div><div class="tbl-wrap"><table><thead><tr><th>Client</th><th>Formule</th><th>Validité</th><th class="r">Séances</th><th>État</th></tr></thead><tbody>${ms}</tbody></table></div></div>`;

 if(type==='impayes'){return{cols:['Document','Client','Date','Total','Payé','Solde'],rows:liveSales().filter(s=>s.total>paidFor(s.id)).map(s=>{const inv=S.invoices.find(i=>i.saleId===s.id);return[inv?inv.no:s.no,cname(s.clientId),fmtD(s.date),fmtM(s.total),fmtM(paidFor(s.id)),fmtM(s.total-paidFor(s.id))]})}}
 if(type==='stock'){return{cols:['SKU','Produit','Stock','Seuil','Valeur achat','Péremption'],rows:S.products.map(p=>[p.sku,p.name,p.stock,p.thr,fmtM(p.stock*p.buy),p.expiry?fmtD(p.expiry):'—'])}}
 if(type==='prestations'){const m={};linesIn(r).filter(l=>l.kind==='S').forEach(l=>{m[l.name]=m[l.name]||{q:0,ca:0,c:0};m[l.name].q+=l.qty;m[l.name].ca+=lineHT(l);m[l.name].c+=lineCost(l)});return{cols:['Prestation','Quantité','CA HT','Prix moyen HT','Marge estimée'],rows:Object.entries(m).sort((a,b)=>b[1].ca-a[1].ca).map(([k,o])=>[k,o.q,fmtM(o.ca),fmtM(Math.round(o.ca/o.q)),pct(o.ca-o.c,o.ca).toLocaleString('fr-FR')+' %'])}}
 if(type==='charges'){const ms=[...new Set(S.expenses.filter(e=>inRange(e.date,r)).map(e=>e.date.slice(0,7)))].sort();return{cols:['Mois','Charges fixes','Charges variables','Total','Lignes'],rows:ms.map(m=>{const es=S.expenses.filter(e=>e.date.startsWith(m)&&inRange(e.date,r));const f=es.filter(e=>e.axe==='Fixe').reduce((a,e)=>a+e.amount,0);const t=es.reduce((a,e)=>a+e.amount,0);return[m.slice(5)+'/'+m.slice(0,4),fmtM(f),fmtM(t-f),fmtM(t),es.length]})}}
 if(type==='avances'){return{cols:['N°','Date','Client','Objet','Reçu','Utilisé','Remboursé','Disponible','Statut'],rows:S.advances.filter(a=>inRange(a.date,r)||advBal(a)>0).map(a=>[a.no,fmtD(a.date),cname(a.clientId),a.purpose,fmtM(a.amount),fmtM(advUsed(a)),fmtM(advRefunded(a)),fmtM(advBal(a)),advStatus(a)])}}
 if(type==='intervenants'){return{cols:['Intervenant','RDV honorés','Annulés ou absents','Minutes réservées'],rows:STAFF.map(s=>{const b=S.bookings.filter(x=>x.staff===s.id&&inRange(x.date,r)&&x.serviceId);return[s.name,b.filter(x=>x.status==='honoré').length,b.filter(x=>['annulé','absent'].includes(x.status)).length,b.filter(x=>x.status!=='annulé').reduce((a,x)=>a+x.dur,0)]})}}

function insights(){
 const r=range('30j');const ls=linesIn(r).filter(l=>l.kind==='S');const m={};ls.forEach(l=>{m[l.name]=m[l.name]||{ca:0,c:0};m[l.name].ca+=lineHT(l);m[l.name].c+=lineCost(l)});
 const out=[];const low=Object.entries(m).map(([k,o])=>[k,o.ca,pct(o.ca-o.c,o.ca)]).sort((a,b)=>a[2]-b[2])[0];
 if(low) out.push(`<b>${esc(low[0])}</b> a la marge estimée la plus faible des prestations vendues sur 30 jours (${low[2].toLocaleString('fr-FR')} % pour ${fmtM(low[1])} de CA). Vérifiez le coût saisi ou le prix.`);
 const slow=S.products.filter(p=>p.stock>0&&!linesIn(r).some(l=>l.refId===p.id));slow.forEach(p=>out.push(`<b>${esc(p.name)}</b> : aucune vente sur 30 jours pour ${p.stock} unités en stock (${fmtM(p.stock*p.buy)} immobilisés).`));
 const closed=S.quotes.filter(x=>['accepté','converti','refusé','expiré'].includes(x.status));out.push(`Devis : ${closed.filter(x=>['accepté','converti'].includes(x.status)).length} acceptés sur ${closed.length} clôturés. L'échantillon est trop petit pour conclure.`);
 return out;
}

function cashReportHTML(c,kind){
 const from=c.opened+' '+(c.openTime||'00:00'),to=c.closing?c.closing.at:TODAY+' '+hm(nowMin());
 const inS=(d,t)=>{const k=(d||'')+' '+(t||'00:00');return k>=from&&k<=to};
 const sales=S.sales.filter(x=>inS(x.date,x.time)),live=sales.filter(x=>x.status!=='annulée'),voided=sales.filter(x=>x.status==='annulée');
 const pays=S.payments.filter(p=>inS(p.date,p.time)&&p.method!==ADV);
 const advs=S.advances.filter(a=>inS(a.date,a.time));
 const advRef=[];S.advances.forEach(a=>a.refunds.forEach(f=>{if(f.date===c.opened&&inS(f.date,f.time||'23:59'))advRef.push(f)}));
 const byM={};const add=(m,v)=>{byM[m]=(byM[m]||0)+v};pays.forEach(p=>add(p.method,p.amount));advs.forEach(a=>add(a.method,a.amount));advRef.forEach(f=>add(f.method,-f.amount));
 const refunds=pays.filter(p=>p.amount<0);const lines=live.flatMap(x=>x.lines);
 const disc=lines.reduce((a,l)=>a+Math.round(l.unit*l.qty)-lineTotal(l),0);
 const items={};lines.forEach(l=>{items[l.name]=items[l.name]||{q:0,v:0};items[l.name].q+=l.qty;items[l.name].v+=lineTotal(l)});
 const mv=t=>(c.moves||[]).filter(m=>m.type===t).reduce((a,m)=>a+m.amount,0);
 const theo=c.closing?c.closing.theo:cashTheo(c);
 const n=v=>fmtM(v).replace(/\s?DT$/,'');const ln=(a,b,cls='')=>`<div class="ln ${cls}"><span>${a}</span><span>${b}</span></div>`;
 const st=S.settings;
 return `<div class="tk"><div class="tk-brand">KAYANI</div><div class="c s">${esc(st.name)}</div><hr>
 <div class="c b">${kind==='Z'?'RAPPORT Z · CLÔTURE DE CAISSE':'RAPPORT X · ÉTAT DE CAISSE'}</div>
 ${ln('Ouverture',fmtD(c.opened)+' '+(c.openTime||''))}${ln('Par',esc(userName(c.user)))}${c.closing?ln('Clôture',fmtD(c.closing.at.slice(0,10))+' '+c.closing.at.slice(11))+ln('Par',esc(userName(c.closing.user))):ln('Édité le',fmtD(TODAY)+' '+hm(nowMin()))}<hr>
 <div class="b">VENTES</div>${ln('Nombre de ventes',live.length)}${voided.length?ln('Ventes annulées',voided.length):''}${ln('Total TTC',n(live.reduce((a,x)=>a+x.total,0)))}${disc?ln('dont remises','−'+n(disc)):''}${ln('Total HT',n(docHT(lines)))}${taxBreakdown(lines).filter(([r])=>+r>0).map(([r,o])=>ln('TVA '+String(r).replace('.',',')+' %',n(o.tva))).join('')}<hr>
 <div class="b">ENCAISSEMENTS</div>${Object.entries(byM).map(([k,v])=>ln(esc(k),n(v))).join('')||ln('Aucun','0,000')}${ln('Total encaissé',n(Object.values(byM).reduce((a,v)=>a+v,0)),'b')}${advs.length?ln('dont avances reçues',n(advs.reduce((a,x)=>a+x.amount,0))):''}${refunds.length?ln('dont remboursements ('+refunds.length+')',n(refunds.reduce((a,p)=>a+p.amount,0))):''}<hr>
 <div class="b">TIROIR (ESPÈCES)</div>${ln('Fonds initial',n(c.opening))}${ln('+ Encaissements',n(mv('Encaissement')+mv(ADV)))}${mv('Remboursement')?ln('− Remboursements',n(mv('Remboursement'))):''}${mv('Entrée manuelle')?ln('+ Entrées',n(mv('Entrée manuelle'))):''}${mv('Sortie manuelle')?ln('− Sorties',n(mv('Sortie manuelle'))):''}${mv('Dépense')?ln('− Dépenses',n(mv('Dépense'))):''}${ln('Solde théorique',n(theo),'b')}${c.closing?ln('Compté',n(c.closing.counted))+ln('Écart',n(c.closing.gap),'b')+(c.closing.reason?`<div class="s">Motif : ${esc(c.closing.reason)}</div>`:''):''}<hr>
 <div class="b">ARTICLES VENDUS</div>${Object.entries(items).sort((a,b)=>b[1].v-a[1].v).map(([k,o])=>ln(esc(o.q+' × '+k),n(o.v))).join('')||'<div class="s">Aucun</div>'}<hr>
 <div class="c s">${kind==='Z'?'Rapport de fin de journée':'État intermédiaire, caisse toujours ouverte'}</div></div>`;
}

const gcalStatus=()=>(S.gcal||[]).find(x=>x.id==='_status')||null;

const bookingSig=b=>[b.date,b.start,b.dur,b.serviceId||'',b.clientId||'',b.status||'',b.staff||'',b.room||'',b.size||0,b.title||''].join('|');
function gcalState(b){
 if(!Store.PROD)return{k:'demo',label:'Mode démo',cls:'p-neutral'};
 if(!gcalOn())return{k:'off',label:'Google non connecté',cls:'p-neutral'};
 const l=gcalLink(b.id);
 if(!l)return b.date<addDays(TODAY,-7)?{k:'old',label:'Non envoyé (ancien)',cls:'p-neutral'}:{k:'wait',label:'En attente d\'envoi',cls:'p-warn'};
 if(l.state==='erreur')return{k:'err',label:'Erreur d\'envoi',cls:'p-crit',msg:l.message};
 if(l.state==='conflit')return{k:'conf',label:'Conflit',cls:'p-crit',msg:l.message};
 if(l.state==='à relier'&&b.status==='externe')return{k:'link',label:'À relier',cls:'p-warn',msg:'Créé dans Google Agenda : choisissez la prestation et la cliente.'};
 if(l.state==='supprimé')return{k:'del',label:'Retiré de Google',cls:'p-neutral',msg:l.message};
 const base=l.sig.endsWith('|x')?l.sig.slice(0,-2):l.sig;
 if(base!==bookingSig(b))return{k:'wait',label:'En attente d\'envoi',cls:'p-warn'};
 return{k:'ok',label:'Synchronisé',cls:'p-good',msg:l.message};
}

 if(!Store.PROD)return `<div class="alert warn"><span>${ic('sync','')}</span><span><b>Mode démonstration.</b> La synchronisation avec Google Agenda fonctionne uniquement dans l'application connectée. Le bloc hachuré illustre un événement importé depuis Google.</span></div>`;
 const st=gcalStatus();
 if(!st)return `<div class="alert warn"><span>${ic('sync','')}</span><span><b>Google Agenda non connecté.</b> Les rendez-vous restent dans KAYANI. ${isAdmin()?'<a href="#" data-a="go" data-v="parametres">Voir la mise en service</a>':'La mise en service est faite par l\'administrateur.'}</span></div>`;
 if(!st.active||st.error)return `<div class="alert crit"><span>${ic('sync','')}</span><span><b>Synchronisation Google interrompue.</b> ${esc(st.error||'')} ${isAdmin()?'<a href="#" data-a="go" data-v="parametres">Paramètres</a>':''}</span></div>`;
 const last=st.lastRun?new Date(st.lastRun).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',timeZone:TZ}):'—';
 const pb=(st.errors||0)+(st.conflicts||0);
 return `<div class="alert ${pb?'warn':'good'}"><span>${ic('sync','')}</span><span><b>Synchronisé avec Google Agenda</b> (${esc(st.calendar||'')}) · dernière vérification à ${last}.${pb?` ${st.conflicts?st.conflicts+' conflit'+(st.conflicts>1?'s':''):''}${st.conflicts&&st.errors?' et ':''}${st.errors?st.errors+' erreur'+(st.errors>1?'s':''):''} à voir : ouvrez le rendez-vous concerné.`:''} Pour réserver depuis Google, nommez l'événement « Prestation — Prénom Nom ».</span></div>`;
}
async function gcalSyncNow(){
 if(!Store.PROD||!Store.client)return;
 try{const {data}=await Store.client.auth.getSession();const tok=data&&data.session&&data.session.access_token;if(!tok)throw new Error('Session expirée : reconnectez-vous.');
  const r=await fetch(window.KAYANI_CONFIG.supabaseUrl+'/functions/v1/gcal-sync',{method:'POST',headers:{Authorization:'Bearer '+tok,apikey:window.KAYANI_CONFIG.supabaseAnonKey,'Content-Type':'application/json'},body:JSON.stringify({mode:'all'})});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Erreur '+r.status));
  toast(r.status===202?'Une synchronisation est déjà en cours.':'Synchronisation Google effectuée.');Store.sync();
 }catch(e){toast('Synchronisation Google impossible : '+(e.message||e),true)}
}
function bookingConflict(b,ignoreId){
 const s=svc(b.serviceId);
 if(b.start<9*60||b.start+b.dur>20*60) return 'Hors des horaires d\'ouverture (09:00–20:00).';
 if(dow(b.date)===0) return 'Le centre est fermé le dimanche.';
 const same=S.bookings.filter(x=>x.id!==ignoreId&&x.date===b.date&&x.status!=='annulé'&&overlap(b.start,b.dur,x.start,x.dur));

}

 doPaySale:d=>{const s=S.sales.find(x=>x.id===d.id);const due=s.total-paidFor(s.id);const amt=parseM(val('ps-amount'));const method=val('ps-method');

 addpay:()=>{const P=ui.pos;const T=posTotals();let amt=P.amount?parseM(P.amount):T.rest;if(isNaN(amt)||amt<=0){toast('Saisissez un montant valide.',true);return}

 validate:()=>{
  const P=ui.pos;if(P.busy)return;if(!P.key)P.key=uid('cart');if(S.processed.has(P.key)){toast('Cette vente a déjà été enregistrée.',true);return}
  const T=posTotals();const cashPay=P.pays.filter(p=>p.method==='Espèces').reduce((a,p)=>a+p.amount,0);
  if(cashPay>0&&!S.cash){toast('Ouvrez la caisse avant d\'encaisser des espèces.',true);return}
  for(const l of P.cart){if(l.kind==='P'&&prd(l.refId).stock<l.qty){toast(`Stock insuffisant pour ${l.name}.`,true);return}}
  P.busy=true;render();
  setTimeout(()=>{ // simule l'aller-retour serveur ; la clé empêche un second enregistrement
   S.processed.add(P.key);
   const change=Math.max(0,-T.rest);
   const isAdv=T.rest>0&&P.pays.length>0;const sale={id:uid('V'),no:nextNo('REC'),date:TODAY,time:hm(nowMin()),clientId:P.clientId||null,lines:P.cart.map(l=>({...l})),total:T.total,user:ui.user.id,status:'validée',key:P.key,advance:isAdv,dueDate:isAdv?(P.due||addDays(TODAY,7)):''};
   S.sales.push(sale);
   sale.lines.filter(l=>l.kind==='P').forEach(l=>{prd(l.refId).stock-=l.qty;S.stockMoves.push({id:uid('SM'),date:TODAY,pid:l.refId,type:'Vente',qty:-l.qty,reason:'Vente '+sale.no,user:ui.user.id,saleLine:sale.id+':'+l.refId})});
   // abonnement / forfait vendu → création de la formule
   sale.lines.filter(l=>l.kind==='S'&&svc(l.refId).sessions&&sale.clientId).forEach(l=>{const s=svc(l.refId);for(let k=0;k<l.qty;k++)S.memberships.push({id:uid('AB'),clientId:sale.clientId,serviceId:s.id,start:TODAY,end:addDays(TODAY,s.days),included:s.sessions,used:0,saleId:sale.id})});
   let chg=change;P.pays.forEach(p=>{let amount=p.amount;if(p.method==='Espèces'&&chg>0){const t=Math.min(chg,amount);amount-=t;chg-=t}if(amount<=0)return;const pay={id:uid('P'),date:TODAY,time:sale.time,saleId:sale.id,method:p.method,amount,user:ui.user.id,key:P.key,kind:p.method===ADV?'Déduit de l\'avance':isAdv?'Avance':'Paiement'};S.payments.push(pay);
    if(p.method===ADV){const ids=consumeAdvance(sale.clientId,amount,sale);pay.kind='Déduit de l\'avance '+ids.join(', ');log('Avance utilisée',`${ids.join(', ')} · ${fmtM(amount)} sur ${sale.no}`)}
    if(p.method==='Espèces')S.cash.moves.push({id:uid('M'),time:sale.time,type:'Encaissement',amount,reason:(isAdv?'Avance vente ':'Vente ')+sale.no,ref:pay.id,user:ui.user.id})});
   log(isAdv?'Vente avec avance':'Vente',`${sale.no} · ${fmtM(sale.total)}${T.rest>0?' · avance '+fmtM(T.paid)+' · reste dû '+fmtM(T.rest)+(isAdv?' au '+fmtD(sale.dueDate):''):''}`);
   Object.assign(ui.pos,{cart:[],pays:[],amount:'',key:null,busy:false,clientId:'',mode:'complet',due:'',cashMode:false,tendered:'',detail:false});
   ui.modal={type:'receipt',id:sale.id,change};render();
  },450);

document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;if(a.tagName==='A')e.preventDefault();const fn=A[a.dataset.a];if(fn&&!a.disabled)fn(a.dataset,a,e)});

 if(!ui.user||ui.view!=='pos')return;

 if(ui.modal)return;
 const k=e.key;if(!['F2','F4','F9','F10','F12','Escape'].includes(k))return;
 if(k==='Escape'){if(ui.pos.cashMode){e.preventDefault();A.cashcancel()}return}

 else if(k==='F4')A.park();

function renderStatus(){const el=document.getElementById('sync-pill');if(!el)return;const st=Store.state;
 const cls=st.syncing?'busy':!navigator.onLine?'off':st.error?'err':'';
 const t=st.syncing?'Synchronisation…':!navigator.onLine?`Hors ligne${st.pending?' · '+st.pending+' en attente':''}`:st.error?'Erreur de synchro':st.pending?st.pending+' en attente':st.lastSync?'À jour '+st.lastSync.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'Connexion…';
 el.className='sync-pill '+cls;el.innerHTML=`<i></i><span>${esc(t)}</span>`;el.title=st.error||'Synchroniser maintenant'}
function rebuildDerived(){
 const stock={};(S.stockMoves||[]).forEach(m=>{stock[m.pid]=(stock[m.pid]||0)+m.qty});(S.products||[]).forEach(p=>p.stock=stock[p.id]||0);
 const open=(S.cashSessions||[]).filter(c=>!c.closing).sort((a,b)=>(b.opened+b.openTime).localeCompare(a.opened+a.openTime));S.cash=open[0]||null;
 S.cashHistory=(S.cashSessions||[]).filter(c=>c.closing).sort((a,b)=>b.closing.at.localeCompare(a.closing.at)).map(c=>({opened:c.opened,user:c.closing.user,opening:c.opening,theo:c.closing.theo,counted:c.closing.counted,gap:c.closing.gap,reason:c.closing.reason}));
 (S.audit||[]).sort((a,b)=>b.at.localeCompare(a.at));
}

async function doLogin(){const email=val('lg-email'),pass=document.getElementById('lg-pass').value;ui.login.email=email;
 if(!email||!pass){ui.login.err='Saisissez votre e-mail et votre mot de passe.';render();return}
 if(!navigator.onLine){ui.login.err='Pas de connexion Internet : la première connexion sur cet appareil en demande une.';render();return}

 try{const p=await Store.signIn(email,pass);ui.login.busy=false;await enter(p)}
 catch(e){ui.login.busy=false;ui.login.err=/Invalid login/i.test(e.message)?'E-mail ou mot de passe incorrect.':/fetch|network|Load failed/i.test(e.message)?'Impossible de joindre le serveur KAYANI. Vérifiez la connexion Internet puis réessayez.':/Email not confirmed/i.test(e.message)?'Adresse e-mail non confirmée : cochez « Auto Confirm User » dans Supabase ou confirmez le compte.':e.message;render()}}

 if(!Store.PROD){render();return}
 document.getElementById('app').innerHTML='<div class="splash"><img src="'+LOGO+'" alt="KAYANI" style="width:96px;border-radius:50%"></div>';
 try{const p=await Store.restore();if(p){await enter(p);return}}catch(e){console.warn(e)}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(new Date())!==TODAY&&!ui.modal)location.reload()});
// Application installable : service worker (cache hors ligne) et avis de mise à jour
if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('sw.js').then(reg=>{
 const show=w=>{if(document.querySelector('.update-band'))return;const b=document.createElement('div');b.className='update-band';b.innerHTML='Nouvelle version de KAYANI disponible <button class="btn sm">Mettre à jour</button>';b.querySelector('button').onclick=()=>{w.postMessage('skipWaiting')};document.body.appendChild(b)};
 if(reg.waiting)show(reg.waiting);
 reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)show(w)})});

}).catch(e=>console.warn('SW',e))}
boot();
