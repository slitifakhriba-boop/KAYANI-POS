<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>KAYANI POS</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2A1E16">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KAYANI">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts.css">
<style>
/* Mise en page : barre latérale espresso + plan de travail sable clair ; palette tirée du compte Instagram KAYANI (sable, caramel, bronze, espresso, mousse) */
:root{
  --bg:#F3ECE1; --surface:#FBF7F0; --sand:#E9DECD; --sand-2:#DCCBB3; --line:#DDCFBA;
  --ink:#2E2119; --muted:#7A6654; --sage:#B58B62; --sage-deep:#4A3426; --sage-tint:#EFE3D1;
  --terra:#9C6237; --terra-tint:#F0DFCC;
  --good:#5D7745; --good-tint:#E3E8D6; --warn:#A5711C; --warn-tint:#F3E5C9; --crit:#A2412F; --crit-tint:#F3DBD3;
  --side:#2A1E16; --side-ink:#F1E7D8; --side-muted:#B9A38A;
  --shadow:0 1px 2px rgba(46,33,25,.06),0 6px 24px rgba(46,33,25,.07);
  --f-display:'Marcellus','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --f-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16100C; --surface:#1F1712; --sand:#2A2019; --sand-2:#352920; --line:#3B2E24;
  --ink:#EFE4D4; --muted:#B39F89; --sage:#C69C72; --sage-deep:#DDBD94; --sage-tint:#33261C;
  --terra:#D38E5C; --terra-tint:#3A281B;
  --good:#9DB77F; --good-tint:#252D1C; --warn:#DDB15A; --warn-tint:#372B17; --crit:#E2836F; --crit-tint:#3B221C;
  --side:#0F0A07; --side-ink:#EFE4D4; --side-muted:#A28D76;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16100C; --surface:#1F1712; --sand:#2A2019; --sand-2:#352920; --line:#3B2E24;
  --ink:#EFE4D4; --muted:#B39F89; --sage:#C69C72; --sage-deep:#DDBD94; --sage-tint:#33261C;
  --terra:#D38E5C; --terra-tint:#3A281B;
  --good:#9DB77F; --good-tint:#252D1C; --warn:#DDB15A; --warn-tint:#372B17; --crit:#E2836F; --crit-tint:#3B221C;
  --side:#0F0A07; --side-ink:#EFE4D4; --side-muted:#A28D76;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 24px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.nw{white-space:nowrap}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:26px} h2{font-size:19px} h3{font-size:16px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
a{color:var(--sage-deep)}
:focus-visible{outline:2px solid var(--terra);outline-offset:2px}

/* Shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:4px;padding:20px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand img{width:38px;height:38px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.login-logo{width:88px;height:88px;border-radius:50%;margin-bottom:16px}
.brand b{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.14em}
.brand small{display:block;font-size:10px;letter-spacing:.12em;color:var(--side-muted);text-transform:uppercase}
.nav-group{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted);padding:14px 12px 4px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;border:0;background:none;color:var(--side-ink);text-align:left;cursor:pointer;width:100%;font-size:14px}
.nav svg{width:18px;height:18px;flex:none;opacity:.85}
.nav:hover{background:rgba(255,255,255,.07)}
.nav.on{background:rgba(255,255,255,.12);box-shadow:inset 3px 0 0 var(--terra)}
.nav .lock{margin-left:auto;width:14px;height:14px;opacity:.6}
.side-foot{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.1);display:grid;gap:8px;font-size:12.5px}
.who{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:#B58B62;color:#2A1E16;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.topbar .grow{flex:1;min-width:0}
.menu-btn{display:none}
.demo-band{background:var(--terra-tint);color:var(--ink);font-size:12.5px;padding-block:7px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band b{color:var(--terra)}
.content{padding-block:24px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:20px;align-content:start}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--muted);max-width:62ch}

/* Composants */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--sage)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--sage-deep);border-color:var(--sage-deep);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.terra{background:var(--terra);border-color:var(--terra);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--crit);border-color:var(--crit-tint)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:999px;cursor:pointer;font-size:13px}
.chip.on{background:var(--sage-deep);color:var(--surface);border-color:var(--sage-deep)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-good{background:var(--good-tint);color:var(--good)} .p-warn{background:var(--warn-tint);color:var(--warn)}
.p-crit{background:var(--crit-tint);color:var(--crit)} .p-neutral{background:var(--sand);color:var(--muted)} .p-sage{background:var(--sage-tint);color:var(--sage-deep)}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
.input:focus{border-color:var(--sage);outline:none;box-shadow:0 0 0 3px var(--sage-tint)}
.search{position:relative}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search .input{padding-left:34px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.note{font-size:12.5px;color:var(--muted)}
.alert{border-radius:10px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.alert.warn{background:var(--warn-tint)} .alert.crit{background:var(--crit-tint)} .alert.info{background:var(--sage-tint)} .alert.good{background:var(--good-tint)} .ag-ev.ev-warn{box-shadow:inset 0 0 0 2px var(--crit)}
.alert b{font-weight:600}

/* Tableaux */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--sand)}
.pager{display:flex;justify-content:space-between;align-items:center;padding-top:12px;font-size:13px;color:var(--muted)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:4px;align-content:start}
.kpi .v{font-size:22px;font-weight:600;letter-spacing:-.01em}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi .tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.delta.up{color:var(--good)} .delta.down{color:var(--crit)}
.kpi.ops{background:var(--sage-tint);border-color:transparent}
.dash{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.toplist{display:grid;gap:10px}
.toplist .it{display:grid;gap:4px}
.bar{height:6px;border-radius:3px;background:var(--sand)}
.bar i{display:block;height:100%;border-radius:3px;background:var(--sage)}
.bar.terra i{background:var(--terra)}

/* POS */
.pos{display:grid;grid-template-columns:minmax(330px,1fr) minmax(0,1.35fr);gap:16px;align-items:start}
.pos-left{display:grid;gap:14px;align-content:start;min-width:0}
.pos-right{display:grid;gap:14px;align-content:start;min-width:0}
.pos-day{grid-column:1/-1;min-width:0}
.cat-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media (max-width:520px){.cat-tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.cat-tile{min-height:84px;padding:12px}.cat-tile b{font-size:17px}}
.cat-tile{border:1px solid var(--line);border-left:6px solid var(--vc,var(--sage));background:var(--vt,var(--surface));border-radius:12px;padding:18px 16px;text-align:left;cursor:pointer;display:grid;gap:6px;min-height:104px;align-content:space-between;font:inherit;color:inherit}
.cat-tile:hover{border-color:var(--vc,var(--sage));box-shadow:var(--shadow)}
.cat-tile b{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.15}
.cat-tile span{font-size:12.5px;color:var(--muted)}
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.subhead{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:4px 0 -2px}
.day-sum{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:13px}
.day-sum b{font-variant-numeric:tabular-nums}
a.btn{text-decoration:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:12.5px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.club-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:16px}
.club-card{display:grid;gap:4px;justify-items:start;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);border-left:4px solid var(--vc,var(--sage));background:var(--surface);font:inherit;color:inherit;cursor:pointer}
.club-card.on{background:var(--vt,var(--sage-tint));border-color:var(--vc)}
.att-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.att{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.att.on,.att:has(input:checked){background:var(--good-tint);border-color:var(--good)}.att input{width:18px;height:18px;accent-color:var(--good)}
.topsum{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(22px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line);font-size:13px}
.topsum .chip{padding:3px 10px;font-size:12px}
.ts-it{display:flex;flex-direction:column;line-height:1.2}.ts-it span{font-size:11px;color:var(--muted);letter-spacing:.03em}.ts-it b{font-size:14px}
.ts-al{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.ts-al.warn{background:var(--warn-tint);color:var(--warn);border-color:transparent}.ts-al.crit{background:var(--crit-tint);color:var(--crit);border-color:transparent}
.cash-banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px;border-radius:12px;margin-bottom:16px}
.cash-banner.closed{background:var(--warn-tint)}.cash-banner.late{background:var(--crit-tint)}.cash-banner.eod{background:var(--sage-tint)}
.cash-banner b{font-size:15px}
@media (max-width:640px){.topsum{gap:6px 12px}.ts-it b{font-size:13px}}
.pay-quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pay-quick .btn{justify-content:center;padding:16px 10px;font-size:16px;font-weight:600}
.pay-quick .btn.wide{grid-column:1/-1}
.cash-pad{display:grid;gap:12px}
.cash-pad .big{font-size:22px;padding:10px 12px;text-align:right}
.big-line{font-size:17px}
.btn.grow{flex:1;justify-content:center;padding:13px;font-size:15px}
.parked{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.parked .chip{display:inline-flex;gap:6px;align-items:center}
.parked .chip .x{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 0 0 4px;font-size:14px;line-height:1}
.kbd-hint kbd{font:11px var(--f-body,inherit);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface)}
@media (max-width:900px){.kbd-hint{display:none}}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.item{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;text-align:left;cursor:pointer;display:grid;gap:6px;align-content:start;min-height:108px}
.item:hover{border-color:var(--sage);box-shadow:var(--shadow)}
.item[disabled]{opacity:.45;cursor:not-allowed}
.item .n{font-weight:600;font-size:13.5px;line-height:1.3}
.item .m{font-size:12px;color:var(--muted)}
.item .p{font-weight:700;margin-top:auto}
.cart{position:sticky;top:76px;display:grid;gap:14px;grid-column:2;grid-row:1 / span 2}
.cline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px}
.qty button{border:0;background:none;width:28px;height:28px;cursor:pointer;font-size:16px}
.qty span{min-width:22px;text-align:center}
.disc{width:64px;padding:4px 6px;font-size:12.5px}
.totals{display:grid;gap:6px}
.totals .spread{font-size:13.5px}
.totals .grand{font-size:20px;font-weight:700;padding-top:8px;border-top:1px solid var(--line)}
.paylist{display:grid;gap:6px}
.payrow{display:flex;justify-content:space-between;align-items:center;background:var(--sand);border-radius:8px;padding:6px 10px;font-size:13px}

/* Agenda */
.agenda-wrap{overflow-x:auto}
.agenda{display:grid;grid-template-columns:56px repeat(3,minmax(190px,1fr));min-width:640px;position:relative}
.ag-col{position:relative;border-left:1px solid var(--line)}
.ag-head{position:sticky;top:0;background:var(--surface);padding:8px 10px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);font-weight:600;font-size:13px}
.ag-hour{font-size:11px;color:var(--muted);text-align:right;padding-right:8px;transform:translateY(-7px)}
.ag-line{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.ag-ev{position:absolute;left:6px;right:6px;border-radius:8px;padding:6px 8px;font-size:12px;cursor:pointer;overflow:hidden;border:1px solid;display:grid;gap:1px;align-content:start}
.ag-ev b{font-size:12.5px}
.ev-corps{background:var(--v-corps-t);border-color:var(--v-corps);border-left-width:4px}
.ev-thera{background:var(--v-thera-t);border-color:var(--v-thera);border-left-width:4px}
.ev-club{background:var(--v-club-t);border-color:var(--v-club);border-left-width:4px}
.ev-off{background:repeating-linear-gradient(135deg,var(--sand),var(--sand) 6px,var(--surface) 6px,var(--surface) 12px);border-color:var(--line);color:var(--muted)}
.ev-cancel{opacity:.5;text-decoration:line-through}
.now-line{position:absolute;left:0;right:0;border-top:2px solid var(--terra);z-index:2}

/* Modale */
.overlay{position:fixed;inset:0;background:rgba(20,26,22,.45);z-index:50;display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:calc(100vh - 48px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{width:min(780px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-b{padding:18px 20px;display:grid;gap:14px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow);max-width:min(420px,calc(100vw - 40px))}
.toast.err{background:var(--crit);color:#fff}

/* Document (reçu / facture) */
.paper{background:#FCF8F1;color:#2E2119;border:1px solid #DDCFBA;border-radius:6px;padding:24px;font-size:13px}
.paper h2{font-family:var(--f-display);letter-spacing:.16em;color:#4A3426}
.paper table td,.paper table th{border-color:#E6DACA;color:#2E2119}
.paper .ph{color:#9C6237;font-style:italic}
/* Ticket de caisse 80 mm (aperçu et impression) */
.tk{width:72mm;max-width:100%;margin:0 auto;background:#fff;color:#000;font:12px/1.4 'Courier New',Courier,monospace;padding:4mm 3mm}
.tk-prev{background:var(--sand);border-radius:10px;padding:14px;display:flex;justify-content:center}
.tk-prev .tk{box-shadow:0 2px 10px rgba(0,0,0,.12)}
.tk .c{text-align:center}.tk .b{font-weight:700}.tk .s{font-size:10.5px}
.tk .ln{display:flex;justify-content:space-between;gap:6px}.tk .ln span:last-child{white-space:nowrap;text-align:right}
.tk hr{border:0;border-top:1px dashed #000;margin:5px 0}
.tk .tk-brand{font:600 20px/1.1 Georgia,'Times New Roman',serif;letter-spacing:.22em;padding-left:.22em;text-align:center}
.tk img{width:20mm;height:20mm;border-radius:50%;display:block;margin:0 auto 2mm;filter:grayscale(1)}
.tk .tot{font-size:15px;font-weight:700}
.print-choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.print-choice .btn{justify-content:center;padding:12px;font-size:14px}
@media (max-width:520px){.print-choice{grid-template-columns:minmax(0,1fr)}}
#print-root{display:none}
@media print{body>*:not(#print-root){display:none!important}#print-root{display:block!important}#print-root .paper{border:0;padding:0;background:#fff}#print-root.ticket .tk{width:72mm;margin:0 auto;padding:0;box-shadow:none}html,body{background:#fff!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* Volets d'activité : une couleur par volet, partagée par la caisse, le ticket et l'agenda */
:root{--v-corps:#3F6E6B;--v-corps-t:#E1ECEA;--v-thera:#8A4F75;--v-thera-t:#F2E2EC;--v-club:#B0721A;--v-club-t:#F6E7CF;--v-herbo:#5D7745;--v-herbo-t:#E5EBDA;--v-autre:#7A6654;--v-autre-t:#EDE5DA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--v-corps:#86BDB8;--v-corps-t:#1C2B2A;--v-thera:#D69BC2;--v-thera-t:#2E1C28;--v-club:#E2AE5C;--v-club-t:#33260F;--v-herbo:#A6C487;--v-herbo-t:#222B19;--v-autre:#B39F89;--v-autre-t:#2A2019}}
:root[data-theme="dark"]{--v-corps:#86BDB8;--v-corps-t:#1C2B2A;--v-thera:#D69BC2;--v-thera-t:#2E1C28;--v-club:#E2AE5C;--v-club-t:#33260F;--v-herbo:#A6C487;--v-herbo-t:#222B19;--v-autre:#B39F89;--v-autre-t:#2A2019}
.v-corps{--vc:var(--v-corps);--vt:var(--v-corps-t)} .v-thera{--vc:var(--v-thera);--vt:var(--v-thera-t)} .v-club{--vc:var(--v-club);--vt:var(--v-club-t)} .v-herbo{--vc:var(--v-herbo);--vt:var(--v-herbo-t)} .v-autre{--vc:var(--v-autre);--vt:var(--v-autre-t)}
.item[class*="v-"]{background:var(--vt);border-color:color-mix(in srgb,var(--vc) 35%,transparent);border-left:5px solid var(--vc)}
.item[class*="v-"]:hover{border-color:var(--vc)}
.item[class*="v-"] .eyebrow{color:var(--vc)}
.chip .dot,.vdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--vc);margin-right:6px;vertical-align:baseline}
.chip.on[class*="v-"]{background:var(--vc);border-color:var(--vc);color:#fff}
.chip.on[class*="v-"] .dot{background:#fff}
.cline[class*="v-"]{border-left:4px solid var(--vc);padding-left:10px}
.vtag{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:12.5px;background:var(--vt);color:var(--vc);font-weight:600}
.vtag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.volets{display:flex;flex-wrap:wrap;gap:8px}
.sync-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.sync-pill i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.sync-pill.off i{background:var(--warn)} .sync-pill.err i{background:var(--crit)} .sync-pill.busy i{background:var(--sage);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.splash{min-height:100vh;display:grid;place-items:center;background:var(--side);color:var(--side-ink)}
.update-band{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--sage-deep);color:var(--surface);padding:10px 14px;border-radius:12px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);font-size:13.5px}
@media (max-width:520px){.sync-pill span{display:none}}
.pw-wrap{position:relative}.pw-wrap .input{padding-right:46px}
.pw-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;padding:8px;cursor:pointer;color:var(--muted);display:grid;place-items:center;border-radius:6px}
.pw-eye:hover{color:var(--ink)} .pw-eye svg{width:20px;height:20px}
.cash-mini{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* Connexion */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.login-art{background:radial-gradient(120% 90% at 85% 100%,rgba(181,139,98,.35),transparent 60%),var(--side);color:var(--side-ink);padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art h1{font-size:44px;letter-spacing:.2em}
.login-art p{max-width:40ch;color:var(--side-muted)}
.login-art svg.rings{position:absolute;right:-120px;bottom:-120px;width:520px;opacity:.18}
.login-form{display:grid;place-items:center;padding:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-box{width:min(400px,100%);display:grid;gap:16px}
.role-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role-card{border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:var(--surface);text-align:left;display:grid;gap:4px}
.role-card.on{border-color:var(--sage-deep);box-shadow:0 0 0 2px var(--sage-tint)}
.role-card small{color:var(--muted);font-size:12px}

.toggle{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.switch{width:40px;height:22px;border-radius:11px;background:var(--sand-2);border:0;position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch.on{background:var(--sage-deep)} .switch.on::after{left:21px}
.steps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:13px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}

@media (max-width:1100px){.dash,.split{grid-template-columns:minmax(0,1fr)} .pos{grid-template-columns:minmax(0,1fr)} .cart{position:static;grid-column:auto;grid-row:2} .pos-left{order:2} .pos-right{order:1} .pos-day{order:3}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s;height:100%;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}
  .menu-btn{display:inline-flex}
  .login{grid-template-columns:minmax(0,1fr)} .login-art{padding:28px 20px;min-height:auto} .login-art h1{font-size:32px}
  .grid3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .topbar,.content,.demo-band{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (max-width:520px){.topbar .pill{display:none} .grid2,.grid3,.role-pick{grid-template-columns:minmax(0,1fr)} h1{font-size:22px} .kpi .v{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Avances clients : argent reçu avant la prestation, conservé comme solde à valoir */
const advUsed=a=>a.uses.reduce((x,u)=>x+u.amount,0);
const advRefunded=a=>a.refunds.reduce((x,u)=>x+u.amount,0);
const advBal=a=>a.amount-advUsed(a)-advRefunded(a);
function advStatus(a){const b=advBal(a);if(b<=0)return advUsed(a)>0?'utilisée':'remboursée';return advUsed(a)+advRefunded(a)>0?'partiellement utilisée':'disponible'}
const clientAdvs=cid=>S.advances.filter(a=>a.clientId===cid&&advBal(a)>0).sort((a,b)=>a.date.localeCompare(b.date));
const clientAdvBal=cid=>cid?clientAdvs(cid).reduce((x,a)=>x+advBal(a),0):0;
function consumeAdvance(cid,amount,sale){let left=amount;const ids=[];for(const a of clientAdvs(cid)){if(left<=0)break;const t=Math.min(left,advBal(a));a.uses.push({date:TODAY,saleId:sale.id,saleNo:sale.no,amount:t});left-=t;ids.push(a.no)}return ids}
/* Encaissements = paiements reçus (hors utilisation d'avance, déjà encaissée) + avances reçues − avances remboursées */
function encIn(r,user='tous'){const u=x=>user==='tous'||x.user===user;
 return S.payments.filter(p=>p.method!==ADV&&inRange(p.date,r)&&u(p)).reduce((a,p)=>a+p.amount,0)
  +S.advances.filter(a=>inRange(a.date,r)&&u(a)).reduce((x,a)=>x+a.amount,0)
  -S.advances.reduce((x,a)=>x+a.refunds.filter(f=>inRange(f.date,r)&&u(f)).reduce((y,f)=>y+f.amount,0),0)}
const isFree=s=>s.price===0;
const svcMeta=s=>s.sessions?`${s.sessions} séances × ${s.dur>=60?(s.dur/60).toLocaleString('fr-FR')+' h':s.dur+' min'}`:(s.dur?(s.dur>=60?(s.dur/60).toLocaleString('fr-FR')+' h':s.dur+' min'):s.type);
const priceTxt=s=>s.price===0?'Gratuit':fmtM(s.price);
const paidFor=saleId=>S.payments.filter(p=>p.saleId===saleId).reduce((a,p)=>a+p.amount,0);
const liveSales=()=>S.sales.filter(s=>s.status!=='annulée');
const inRange=(d,r)=>d>=r.from&&d<=r.to;
function range(p){
 const t=TODAY; const first=t.slice(0,8)+'01'; const day=+t.slice(8,10);
 if(p==='jour') return {from:t,to:t,pf:addDays(t,-1),pt:addDays(t,-1),label:'Aujourd\'hui',plabel:'hier'};
 if(p==='7j') return {from:addDays(t,-6),to:t,pf:addDays(t,-13),pt:addDays(t,-7),label:'7 derniers jours',plabel:'7 jours précédents'};
 if(p==='30j') return {from:addDays(t,-29),to:t,pf:addDays(t,-59),pt:addDays(t,-30),label:'30 derniers jours',plabel:'30 jours précédents'};
 const pf=addDays(first,-1).slice(0,8)+'01'; return {from:first,to:t,pf,pt:addDays(pf,day-1),label:'Ce mois-ci',plabel:'même période du mois dernier'};

/* Période du tableau de bord : jour, semaine (lundi-dimanche), mois ou année contenant la date choisie.
   La période en cours s'arrête à aujourd'hui ; la période précédente a la même durée. */
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
function lastOfMonth(iso){const d=new Date(Date.UTC(+iso.slice(0,4),+iso.slice(5,7),0));return d.toISOString().slice(0,10)}
const daysDiff=(a,b)=>Math.round((new Date(b+'T12:00:00Z')-new Date(a+'T12:00:00Z'))/864e5);
const minD=(a,b)=>a<b?a:b;
function shiftMonth(iso,n){const y=+iso.slice(0,4),m=+iso.slice(5,7)-1+n;const first=new Date(Date.UTC(y,m,1)).toISOString().slice(0,10);return first.slice(0,8)+String(Math.min(+iso.slice(8,10),+lastOfMonth(first).slice(8,10))).padStart(2,'0')}
function periodAt(p,ref){
 if(p==='jour'){const pf=addDays(ref,-1);return {from:ref,to:ref,pf,pt:pf,label:(ref===TODAY?'Aujourd\'hui, ':'')+JOURS[dow(ref)]+' '+fmtD(ref),plabel:'la veille'}}
 if(p==='semaine'){const mon=addDays(ref,-((dow(ref)+6)%7)),sun=addDays(mon,6),to=minD(sun,TODAY<mon?sun:TODAY);const pf=addDays(mon,-7);return {from:mon,to,pf,pt:addDays(pf,daysDiff(mon,to)),label:'Semaine du '+fmtD(mon)+' au '+fmtD(sun),plabel:'la semaine précédente'}}
 if(p==='annee'){const y=ref.slice(0,4),from=y+'-01-01',end=y+'-12-31',to=minD(end,TODAY<from?end:TODAY);const pf=(+y-1)+'-01-01';return {from,to,pf,pt:minD(addDays(pf,daysDiff(from,to)),(+y-1)+'-12-31'),label:'Année '+y,plabel:'même période de '+(+y-1)}}
 const from=ref.slice(0,8)+'01',end=lastOfMonth(from),to=minD(end,TODAY<from?end:TODAY);const pf=shiftMonth(from,-1);

function buildAlerts(){

 S.advances.filter(a=>advBal(a)>0&&a.expected&&a.expected<TODAY).forEach(a=>alerts.push(['warn',`<b>Avance non utilisée</b> · ${esc(cname(a.clientId))}, ${a.no} : ${fmtM(advBal(a))} (prévue le ${fmtD(a.expected)})`]));
 S.products.filter(p=>p.price>0).forEach(p=>{ if(p.stock<=0) alerts.push(['crit',`<b>Rupture</b> · ${esc(p.name)}`]); else if(p.stock<=p.thr) alerts.push(['warn',`<b>Stock faible</b> · ${esc(p.name)} : ${p.stock} restants (seuil ${p.thr})`]);
  if(p.expiry&&p.expiry<=addDays(TODAY,30)) alerts.push(['warn',`<b>Péremption proche</b> · ${esc(p.name)}, lot ${p.lot} : ${fmtD(p.expiry)}`]) });
 S.memberships.forEach(m=>{ if(!m.cancelled&&m.end<=addDays(TODAY,7)&&m.end>=addDays(TODAY,-15)) alerts.push(['info',`<b>Abonnement</b> · ${esc(cname(m.clientId))} : ${esc(svc(m.serviceId).name)} expire le ${fmtD(m.end)} (${memberLeft(m)} séance${memberLeft(m)>1?'s':''} restante${memberLeft(m)>1?'s':''})`]) });
 openAdvances().filter(s=>s.dueDate&&s.dueDate<=addDays(TODAY,2)).forEach(s=>alerts.push([s.dueDate<TODAY?'crit':'warn',`<b>Solde d'avance ${s.dueDate<TODAY?'en retard':'attendu'}</b> · ${esc(cname(s.clientId))}, ${s.no} : ${fmtM(s.total-paidFor(s.id))} au ${fmtD(s.dueDate)}`]));
 const lateInv=S.invoices.filter(i=>invStatus(i)==='en retard');
 if(isAdmin()&&lateInv.length) alerts.unshift(['crit',`<b>${lateInv.length} facture${lateInv.length>1?'s':''} en retard</b> · ${lateInv.map(i=>i.no).join(', ')}`]);
 if(isAdmin()){const li=allInst().filter(x=>instLeft(x.i)>0);const lt=li.filter(x=>x.i.due<TODAY),sn=li.filter(x=>x.i.due>=TODAY&&x.i.due<=addDays(TODAY,7));if(lt.length)alerts.unshift(['crit',`<b>${lt.length} échéance${lt.length>1?'s':''} en retard</b> · ${lt.slice(0,3).map(x=>esc(x.c.label)+' '+fmtM(instLeft(x.i))).join(', ')}`]);sn.forEach(x=>alerts.push(['warn',`<b>Échéance le ${fmtD(x.i.due)}</b> · ${esc(x.c.label)} : ${fmtM(instLeft(x.i))}`]))}
 if(isAdmin()&&(S.team||[]).some(m=>m.kind==='salarié'&&m.active!==false)){const day=+TODAY.slice(8,10),M=TODAY.slice(0,7);if(day>=23&&!(S.settings.payrollSent||{})[M])alerts.push([day>26?'crit':'warn',`<b>Éléments de paie de ${MOIS[+M.slice(5,7)-1]}</b> · à envoyer au comptable le 26 (Équipe › Éléments de paie)`]);const miss=staffList('salarié').filter(m=>worksOn(m,TODAY)&&!presOf(m.id,TODAY));if(miss.length&&nowMin()>=10*60)alerts.push(['info',`<b>Présence du jour</b> · ${miss.length} fiche${miss.length>1?'s':''} à saisir (${miss.map(m=>esc(m.name)).join(', ')})`])}

 return alerts}

 return `${banner}
 <div class="pos">
  <div class="pos-left">
   <div class="card" style="display:grid;gap:12px">

    <div class="row" style="flex-wrap:nowrap"><select class="input" id="pos-client" data-in="posclient"><option value="">Client de passage</option>${S.clients.map(c=>`<option value="${c.id}" ${P.clientId===c.id?'selected':''}>${esc(c.first+' '+c.last)} · ${esc(c.phone)}</option>`).join('')}</select><button class="btn sm" data-a="modal" data-m="newClient" data-from="pos" title="Nouveau client">${ic('plus')}</button></div>
    ${(()=>{const pk=parkedGet();return pk.length?`<div class="parked"><span class="note">En attente :</span>${pk.map(w=>`<span class="chip" data-a="unpark" data-id="${w.id}" role="button" tabindex="0" title="Reprendre cette vente">${esc(w.at)} · ${esc(w.clientId?cname(w.clientId):'Passage')} · ${fmtM(docTotal(w.cart))}<button class="x" data-a="dropParked" data-id="${w.id}" aria-label="Supprimer">×</button></span>`).join('')}</div>`:''})()}
    ${P.clientId?memberHint(P.clientId):''}
    <div>${cartHtml}</div>
    ${P.cart.length?`<div class="row" style="gap:8px"><label class="note" for="pos-gdisc">Remise sur toute la vente</label><input class="input disc num" id="pos-gdisc" inputmode="decimal" placeholder="%"><button class="btn sm" data-a="globaldisc">Appliquer</button></div>`:''}
    <div class="totals num">
     <div class="spread"><span class="muted">Sous-total TTC</span><span>${fmtM(T.sub)}</span></div>

     <div class="spread"><span class="muted">Total HT</span><span>${fmtM(docHT(P.cart))}</span></div>
     ${taxBreakdown(P.cart).map(([r,o])=>`<div class="spread"><span class="muted">TVA ${String(r).replace('.',',')} %</span><span>${fmtM(o.tva)}</span></div>`).join('')}
     <div class="spread grand"><span>Total TTC</span><span>${fmtM(T.total)}</span></div>
    </div>
    ${overDisc?`<div class="alert crit"><span>Remise supérieure à ${S.perms.discountMax} % : la validation d'un administrateur est requise.</span></div>`:''}
   </div>
   <div class="card" style="display:grid;gap:12px">
    ${P.detail?`    <div class="spread"><h3>Règlement</h3><div class="chips" role="group" aria-label="Type de règlement"><button class="chip ${P.mode==='complet'?'on':''}" data-a="paymode" data-m="complet">Paiement complet</button><button class="chip ${P.mode==='avance'?'on':''}" data-a="paymode" data-m="avance">Vente avec avance</button></div></div>
    ${P.mode==='avance'?`<div class="alert info" style="display:grid;gap:8px"><span>Le client verse un acompte sur cette vente ; le reste est suivi comme solde dû et encaissé plus tard depuis « Ventes à solder ». Pour un paiement avant toute vente, utilisez « Avances clients ».</span>
     <div class="row"><span class="note">Avance rapide :</span>${[30,50].map(x=>`<button class="chip" data-a="advpct" data-p="${x}" ${!P.cart.length?'disabled':''}>${x} % · ${fmtM(Math.round(T.total*x/100/1000)*1000)}</button>`).join('')}</div>
     <div class="field"><label for="pos-due">Solde attendu le</label><input class="input" id="pos-due" type="date" data-in="posdue" value="${P.due||addDays(TODAY,7)}" min="${TODAY}"></div></div>`:''}
    <div class="chips">${METHODS.map(m=>`<button class="chip ${P.method===m?'on':''}" data-a="paymethod" data-m="${m}">${m}</button>`).join('')}${advAvail>0?`<button class="chip ${P.method===ADV?'on':''}" data-a="paymethod" data-m="${ADV}">Avance client · ${fmtM(advAvail)}</button>`:''}</div>

    <div class="row" style="flex-wrap:nowrap"><input class="input num" id="pos-amount" data-in="posamount" inputmode="decimal" placeholder="${toInput(Math.max(T.rest,0))}" value="${esc(P.amount)}"><button class="btn" data-a="addpay" ${T.rest<=0||!P.cart.length?'disabled':''}>Ajouter</button></div>
    <div class="paylist">${P.pays.map((p,i)=>`<div class="payrow"><span>${p.method}</span><span class="row" style="gap:6px"><b class="num">${fmtM(p.amount)}</b><button class="btn ghost sm" data-a="rmpay" data-i="${i}" aria-label="Retirer">${ic('x')}</button></span></div>`).join('')}</div>

    ${(P.mode==='avance'||(T.rest>0&&P.pays.length))&&!P.clientId?'<div class="alert warn"><span>Une vente avec avance nécessite un client identifié pour suivre le solde dû.</span></div>':''}
    ${P.mode==='avance'&&P.cart.length&&!P.pays.length?'<div class="note">Ajoutez le montant de l\'avance reçue, ou utilisez un raccourci 30 % / 50 %.</div>':''}
    <button class="btn terra" id="pos-validate" style="justify-content:center;padding:12px;font-size:15px" data-a="validate" ${!P.cart.length||overDisc||P.busy||(T.rest>0&&!P.clientId)||(!P.pays.length&&T.total>0&&!P.clientId)||(P.mode==='avance'&&(!P.pays.length||!P.clientId))?'disabled':''}>${P.busy?'Enregistrement…':P.mode==='avance'&&T.rest>0?'Enregistrer la vente avec avance de '+fmtM(T.paid):T.rest>0&&P.pays.length?'Valider avec acompte':T.rest>0?'Valider sans paiement (créance)':'Valider la vente'}</button>
    <div class="note">Un double clic ne crée pas deux ventes : chaque panier porte une clé unique et le bouton se verrouille pendant l'enregistrement.</div>
   `:(()=>{const dis=!P.cart.length||overDisc||P.busy;
     if(P.cashMode){const tend=parseM(P.tendered||'');const t=isNaN(tend)?null:tend;const ch=t===null?null:t-T.rest;
      const sugg=[...new Set([T.rest,...[5000,10000,20000,50000,100000].map(u=>Math.ceil(T.rest/u)*u)])].filter(v=>v>=T.rest).sort((x,y)=>x-y).slice(0,5);
      return `<div class="spread"><h3>Espèces</h3><span class="note">À payer <b class="num">${fmtM(T.rest)}</b></span></div><div class="cash-pad">
       <div class="field"><label for="pos-tender">Montant reçu</label><input class="input num big" id="pos-tender" data-in="postender" inputmode="decimal" value="${esc(P.tendered||'')}" placeholder="${toInput(T.rest)}" autocomplete="off"></div>
       <div class="chips">${sugg.map(v=>`<button class="chip" data-a="tender" data-v="${v}">${v===T.rest?'Montant exact':fmtM(v)}</button>`).join('')}</div>
       <div class="spread num big-line"><span>Monnaie à rendre</span><b style="color:${ch!==null&&ch<0?'var(--crit)':'var(--good)'}">${ch===null?fmtM(0):ch<0?'Montant insuffisant':fmtM(ch)}</b></div>
       <div class="row" style="flex-wrap:nowrap"><button class="btn" data-a="cashcancel">Retour</button><button class="btn terra grow" id="pos-cashpay" data-a="cashpay" ${dis||(ch!==null&&ch<0)?'disabled':''}>${P.busy?'Enregistrement…':'Encaisser '+fmtM(t!==null&&t>=T.rest?t:T.rest)}</button></div></div>`}
     return `<div class="spread"><h3>Règlement</h3><span class="note">${P.cart.length?'À payer <b class="num">'+fmtM(Math.max(T.rest,0))+'</b>':'Panier vide'}</span></div>
      <div class="pay-quick">${METHODS.map(m=>`<button class="btn ${m==='Espèces'?'terra':''}" data-a="quickpay" data-m="${m}" ${dis?'disabled':''}>${m}</button>`).join('')}${advAvail>0?`<button class="btn wide" data-a="quickpay" data-m="${ADV}" ${dis?'disabled':''}>Avance client · ${fmtM(advAvail)}</button>`:''}</div>
      ${overDisc?'':`<div class="note">Un seul geste : la vente est réglée en totalité et enregistrée. En espèces, saisissez le montant reçu pour calculer la monnaie.</div>`}`})()}
    <div class="row" style="justify-content:space-between;gap:8px"><button class="btn ghost sm" data-a="paydetail">${P.detail?'‹ Paiement rapide':'Paiement partagé, acompte ou à crédit'}</button><button class="btn ghost sm" data-a="park" ${!P.cart.length||P.busy?'disabled':''}>Mettre en attente</button></div>
    <div class="note kbd-hint">Clavier : <kbd>F2</kbd> rechercher · <kbd>F9</kbd> espèces · <kbd>F10</kbd> carte · <kbd>F12</kbd> espèces, montant exact · <kbd>F4</kbd> mettre en attente</div>
   </div>
   ${cashMini()}
  </div>
  <div class="pos-right">
   <div class="card" style="display:grid;gap:14px">
    <div class="search">${ic('search')}<input class="input" id="pos-q" data-in="posq" placeholder="Rechercher une prestation ou un produit (nom, SKU, code-barres)" value="${esc(P.q)}" autocomplete="off"></div>
    ${right}
   </div>
  </div>
  ${recap}
 </div>
 ${openAdvances().length?advancesCard().replace('style="grid-column:1/2"','style="margin-top:16px"'):''}`;
}
function cashMini(){const c=S.cash;return `<div class="card cash-mini"><div><h3>Tiroir-caisse</h3><div class="note">${c?`Ouvert à ${c.openTime} par ${esc(userName(c.user))} · solde espèces <b class="num">${fmtM(cashTheo(c))}</b>`:'Fermé : ouvrez-le pour encaisser des espèces'}</div></div><div class="row">${c?`<button class="btn sm" data-a="modal" data-m="cashMove">Entrée ou sortie</button><button class="btn sm" data-a="modal" data-m="cashReport" data-id="${c.id}">Rapport X</button><button class="btn sm terra" data-a="modal" data-m="closeCash">Clôturer</button>`:`<button class="btn sm primary" data-a="modal" data-m="openCash">Ouvrir la caisse</button>`}</div></div>`}
function openAdvances(){return liveSales().filter(s=>s.clientId&&s.total-paidFor(s.id)>0&&!S.invoices.some(i=>i.saleId===s.id&&i.status!=='annulée')).sort((a,b)=>(a.dueDate||a.date).localeCompare(b.dueDate||b.date))}
function advancesCard(){const rows=openAdvances();return `<div class="card" style="grid-column:1/2"><div class="card-h"><div><h3>Ventes à solder</h3><div class="note">Ventes enregistrées avec un acompte, dont le reste est à encaisser</div></div><span class="pill ${rows.length?'p-warn':'p-neutral'}">${rows.length}</span></div>
 <div class="tbl-wrap"><table><thead><tr><th>Vente</th><th>Client</th><th class="r">Total TTC</th><th class="r">Avance reçue</th><th class="r">Reste</th><th>Solde attendu</th><th></th></tr></thead><tbody>
 ${rows.map(s=>{const paid=paidFor(s.id);const late=s.dueDate&&s.dueDate<TODAY;return `<tr><td class="num"><b>${s.no}</b><div class="note">${fmtD(s.date)} · ${esc(s.lines.map(l=>l.name).join(', '))}</div></td><td>${esc(cname(s.clientId))}</td><td class="r num">${fmtM(s.total)}</td><td class="r num">${fmtM(paid)}</td><td class="r num" style="font-weight:600;color:var(--terra)">${fmtM(s.total-paid)}</td><td class="num">${s.dueDate?fmtD(s.dueDate):'—'}${late?' <span class="pill p-crit">En retard</span>':''}</td><td><button class="btn sm primary" data-a="modal" data-m="paySale" data-id="${s.id}">Encaisser le solde</button></td></tr>`}).join('')||'<tr><td colspan="7" class="muted">Aucune avance en attente de solde.</td></tr>'}
 </tbody></table></div></div>`}
function memberHint(cid){const ms=S.memberships.filter(m=>m.clientId===cid&&m.end>=TODAY&&memberLeft(m)>0&&!m.cancelled);if(!ms.length)return'';return `<div class="alert info" style="display:grid;gap:8px">${ms.map(m=>`<div class="spread" style="gap:10px"><span><b>${esc(svc(m.serviceId).name)}</b> : ${memberLeft(m)} séance${memberLeft(m)>1?'s':''} restante${memberLeft(m)>1?'s':''}, jusqu'au ${fmtD(m.end)}</span><button class="btn sm" data-a="modal" data-m="useSession" data-id="${m.id}">Utiliser une séance</button></div>`).join('')}</div>`}
const parkedGet=()=>{try{return JSON.parse(localStorage.getItem('kayani.parked')||'[]')}catch(e){return[]}};
const parkedSet=a=>{try{localStorage.setItem('kayani.parked',JSON.stringify(a))}catch(e){}};

/* --- Catalogue --- */
function viewCatalogue(){
 const t=ui.cat.tab,q=ui.cat.q.toLowerCase();
 const head=`<div class="head"><div><h1>Catalogue</h1><p>Prestations et produits de l'herboristerie, vendus dans le même panier.${can('catalogEdit')?'':' Consultation seule pour votre profil.'}</p></div>
  <div class="row"><div class="chips"><button class="chip ${t==='services'?'on':''}" data-a="cattab" data-t="services">Prestations · ${S.services.length}</button><button class="chip ${t==='produits'?'on':''}" data-a="cattab" data-t="produits">Herboristerie · ${S.products.length}</button><button class="chip ${t==='mouvements'?'on':''}" data-a="cattab" data-t="mouvements">Mouvements de stock</button></div>
  ${can('catalogEdit')&&t!=='mouvements'?`<button class="btn primary" data-a="modal" data-m="${t==='services'?'editService':'editProduct'}">${ic('plus')}${t==='services'?'Nouvelle prestation':'Nouveau produit'}</button>`:''}</div></div>`;
 let body;
 if(t==='services'){
  const rows=S.services.filter(s=>!q||(s.name+s.ref+s.cat).toLowerCase().includes(q));
  body=`<table><thead><tr><th>Réf.</th><th>Prestation</th><th>Catégorie</th><th>Type</th><th class="r">Durée</th><th class="r">Prix</th>${isAdmin()?'<th class="r">Coût estimé</th><th class="r">Marge</th>':''}<th>Intervenant · salle</th><th>Statut</th></tr></thead><tbody>
  ${rows.map(s=>`<tr class="${can('catalogEdit')?'click':''}" ${can('catalogEdit')?`data-a="modal" data-m="editService" data-id="${s.id}"`:''}><td class="num muted">${s.ref}</td><td><b>${esc(s.name)}</b><div class="note">${esc(s.desc)}</div></td><td class="v-${volet(s.cat)}"><span class="vdot"></span>${s.cat}</td><td>${s.type}${s.cap?` · ${s.cap} pl.`:''}${s.sessions?` · ${s.sessions} séances / ${s.days} j`:''}</td><td class="r num">${s.dur?s.dur+' min':'—'}</td><td class="r num">${priceTxt(s)}</td>${isAdmin()?`<td class="r num muted">${s.cost?fmtM(s.cost):'<span style="color:var(--warn)">À saisir</span>'}</td><td class="r num">${s.cost&&s.price?pct(s.price-s.cost,s.price).toLocaleString('fr-FR')+' %':'—'}</td>`:''}<td>${staffName(s.staff)} · ${s.room||'—'}</td><td>${s.active?(s.bookable?pill('confirmé').replace('Confirmé','Réservable'):pill('confirmé').replace('Confirmé','Actif')):'<span class="pill p-neutral">Archivé</span>'}</td></tr>`).join('')}</tbody></table>`;
 } else if(t==='produits'){
  const rows=S.products.filter(p=>!q||(p.name+p.sku+p.cat+p.supplier+p.bar).toLowerCase().includes(q));
  body=`<table><thead><tr><th>SKU</th><th>Produit</th><th>Catégorie</th><th>Fournisseur</th>${isAdmin()?'<th class="r">Achat</th>':''}<th class="r">Vente</th>${isAdmin()?'<th class="r">Marge</th>':''}<th class="r">Stock</th><th>Lot · péremption</th><th>État</th>${can('stock')?'<th></th>':''}</tr></thead><tbody>
  ${rows.map(p=>{const st=!p.price?'<span class="pill p-warn">À compléter</span>':p.stock<=0?'<span class="pill p-crit">Rupture</span>':p.stock<=p.thr?'<span class="pill p-warn">Stock faible</span>':'<span class="pill p-good">En stock</span>';const exp=p.expiry&&p.expiry<=addDays(TODAY,30);
  return `<tr><td class="num muted">${p.sku}${p.bar?`<div class="note">${p.bar}</div>`:''}</td><td><b>${esc(p.name)}</b></td><td>${p.cat}</td><td>${esc(p.supplier)}</td>${isAdmin()?`<td class="r num muted">${fmtM(p.buy)}</td>`:''}<td class="r num">${p.price?fmtM(p.price):'<span style="color:var(--warn)">À saisir</span>'}</td>${isAdmin()?`<td class="r num">${p.price&&p.buy?pct(p.price-p.buy,p.price).toLocaleString('fr-FR')+' %':'—'}</td>`:''}<td class="r num"><b>${p.stock}</b><div class="note">seuil ${p.thr}</div></td><td>${p.lot||'—'}<div class="note" style="${exp?'color:var(--warn);font-weight:600':''}">${p.expiry?fmtD(p.expiry):'Sans date'}</div></td><td>${st}</td>${can('stock')?`<td><div class="row" style="flex-wrap:nowrap;gap:6px"><button class="btn sm" data-a="modal" data-m="editProduct" data-id="${p.id}">Modifier</button><button class="btn sm" data-a="modal" data-m="stockMove" data-id="${p.id}">Mouvement</button></div></td>`:''}</tr>`}).join('')}</tbody></table>
  ${isAdmin()?`<div class="note" style="padding-top:10px">Valeur du stock au prix d'achat : <b class="num">${fmtM(S.products.reduce((a,p)=>a+p.buy*p.stock,0))}</b></div>`:''}`;
 } else {
  const rows=[...S.stockMoves].reverse().filter(m=>!q||(prd(m.pid).name+m.reason+m.type).toLowerCase().includes(q));
  body=`<table><thead><tr><th>Date</th><th>Produit</th><th>Type</th><th class="r">Quantité</th><th>Justification</th><th>Utilisateur</th></tr></thead><tbody>${rows.map(m=>`<tr><td class="num">${fmtD(m.date)}</td><td>${esc(prd(m.pid).name)}</td><td>${m.type}</td><td class="r num" style="color:${m.qty<0?'var(--crit)':'var(--good)'}">${m.qty>0?'+':''}${m.qty}</td><td>${esc(m.reason)}</td><td>${userName(m.user)}</td></tr>`).join('')}</tbody></table>`;
 }
 return head+`<div class="card"><div class="card-h"><div class="search" style="width:min(360px,100%)">${ic('search')}<input class="input" id="cat-q" data-in="catq" placeholder="Rechercher" value="${esc(ui.cat.q)}"></div></div><div class="tbl-wrap">${body}</div></div>`;
}

/* --- Clients --- */
function clientStats(c){const sales=liveSales().filter(s=>s.clientId===c.id);const visits=new Set(sales.map(s=>s.date));S.bookings.filter(b=>b.clientId===c.id&&b.status==='honoré').forEach(b=>visits.add(b.date));const last=[...visits].sort().pop()||'';const next=S.bookings.filter(b=>b.clientId===c.id&&b.date>=TODAY&&b.status==='confirmé').map(b=>b.date).sort()[0]||'';const due=sales.reduce((a,s)=>a+Math.max(0,s.total-paidFor(s.id)),0);const spent=sales.reduce((a,s)=>a+s.total,0);return{sales,visits:visits.size,last,next,due,spent}}
function viewClients(){if(ui.cli.tab==='analyse'&&isAdmin())return `<div class="head"><div><h1>Clients</h1><p>Meilleures clientes, habitudes et segments pour adapter les offres.</p></div>${cliTabs()}</div>${viewClientAnalysis()}`;return viewClientsList()}
const cliTabs=()=>isAdmin()?`<div class="chips"><button class="chip ${ui.cli.tab!=='analyse'?'on':''}" data-a="clitab" data-t="liste">Fichier clients</button><button class="chip ${ui.cli.tab==='analyse'?'on':''}" data-a="clitab" data-t="analyse">Analyse</button></div>`:'';
function viewClientsList(){
 const q=ui.cli.q.toLowerCase(),seg=ui.cli.seg;
 let rows=S.clients.map(c=>({c,st:clientStats(c)}));
 const bdaySoon=c=>{if(!c.birth)return false;for(let i=0;i<30;i++){if(addDays(TODAY,i).slice(5)===c.birth.slice(5))return true}return false};
 rows=rows.filter(({c,st})=>(!q||(c.first+' '+c.last+c.phone+c.email).toLowerCase().includes(q))&&(seg==='tous'||(seg==='reg'&&st.visits>=6)||(seg==='inactifs'&&(!st.last||st.last<addDays(TODAY,-45)))||(seg==='anniv'&&bdaySoon(c))||(seg==='solde'&&st.due>0)||(seg==='nouveaux'&&c.created>=addDays(TODAY,-30))||(seg==='avance'&&clientAdvBal(c.id)>0)));
 const per=8,pages=Math.max(1,Math.ceil(rows.length/per));ui.cli.page=Math.min(ui.cli.page,pages);const slice=rows.slice((ui.cli.page-1)*per,ui.cli.page*per);
 const segs=[['tous','Tous'],['reg','Réguliers'],['nouveaux','Nouveaux (30 j)'],['inactifs','Inactifs (45 j)'],['anniv','Anniversaire < 30 j'],['solde','Solde dû'],['avance','Avance disponible']];
 return `<div class="head"><div><h1>Clients</h1><p>Fiche commerciale uniquement : aucune note thérapeutique ni donnée de santé n'est enregistrée ici.</p></div><div class="row">${cliTabs()}<button class="btn primary" data-a="modal" data-m="newClient">${ic('plus')}Nouveau client</button></div></div>
 <div class="card"><div class="card-h"><div class="search" style="width:min(360px,100%)">${ic('search')}<input class="input" id="cli-q" data-in="cliq" placeholder="Nom, téléphone ou e-mail" value="${esc(ui.cli.q)}"></div><div class="chips">${segs.map(([k,l])=>`<button class="chip ${seg===k?'on':''}" data-a="cliseg" data-s="${k}">${l}</button>`).join('')}</div></div>

  <td><div class="row" style="flex-wrap:nowrap;gap:6px"><button class="btn sm" data-a="modal" data-m="quote" data-id="${x.id}">Voir</button>
  ${x.status==='brouillon'?`<button class="btn sm" data-a="qstatus" data-id="${x.id}" data-s="envoyé">Marquer envoyé</button>`:''}
  ${x.status==='envoyé'?`<button class="btn sm" data-a="qstatus" data-id="${x.id}" data-s="accepté">Accepté</button><button class="btn sm" data-a="qstatus" data-id="${x.id}" data-s="refusé">Refusé</button>`:''}
  ${x.status==='accepté'?`<button class="btn sm primary" data-a="convert" data-id="${x.id}" ${can('invoice')?'':'disabled title="Permission requise"'}>Convertir en facture</button>`:''}</div></td></tr>`).join('')}</tbody></table>
  <div class="note" style="padding-top:10px">Taux de conversion des devis clôturés : <b>${pct(S.quotes.filter(x=>['accepté','converti'].includes(x.status)).length,S.quotes.filter(x=>['accepté','converti','refusé','expiré'].includes(x.status)).length).toLocaleString('fr-FR')} %</b></div>`;

 const moves=c?`<div class="card"><h3 style="margin-bottom:10px">Mouvements de la session</h3><div class="tbl-wrap"><table><thead><tr><th>Heure</th><th>Type</th><th>Motif</th><th>Utilisateur</th><th class="r">Montant</th></tr></thead><tbody>${[...c.moves].reverse().map(m=>`<tr><td class="num">${m.time}</td><td>${m.type}</td><td>${esc(m.reason)}</td><td>${userName(m.user)}</td><td class="r num" style="color:${m.amount<0?'var(--crit)':'var(--good)'}">${m.amount>0?'+':''}${fmtM(m.amount)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Aucun mouvement.</td></tr>'}</tbody></table></div></div>`:'';
 const hist=`<div class="card"><h3 style="margin-bottom:10px">Historique des clôtures</h3><div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Responsable</th><th class="r">Théorique</th><th class="r">Compté</th><th class="r">Écart</th><th>Justification</th></tr></thead><tbody>${S.cashHistory.map(h=>`<tr><td class="num">${fmtD(h.opened)}</td><td>${userName(h.user)}</td><td class="r num">${fmtM(h.theo)}</td><td class="r num">${fmtM(h.counted)}</td><td class="r num" style="color:${h.gap?'var(--crit)':'inherit'}">${fmtM(h.gap)}</td><td>${esc(h.reason)||'—'}</td></tr>`).join('')}</tbody></table></div></div>`;

 const expSum=exps.reduce((a,e)=>a+e.amount,0);

 <div class="row" style="margin-bottom:12px"><div class="search" style="width:min(260px,100%)">${ic('search')}<input class="input" id="exp-q" data-in="expq" placeholder="Fournisseur, catégorie, détail" value="${esc(E.q)}"></div>

 const row=(l,v,note='')=>`<div class="spread"><span>${l}${note?`<div class="note">${note}</div>`:''}</span><b class="num">${fmtM(v)}</b></div>`;

 <div class="totals">${row('Encaissements TTC',enc,'Argent reçu, avances comprises, TVA comprise')}${row('Avances clients à valoir',S.advances.reduce((x,a)=>x+advBal(a),0),'Reçues mais pas encore consommées : à servir en prestations')}${row('TVA collectée',ls.reduce((a,l)=>a+lineTVA(l),0),'À reverser, sur les ventes du mois')}${row('Dépenses payées',dep,'Toutes catégories')}${row('Créances clients',cre,'À date, toutes périodes')}${row('Dettes fournisseurs',0,'Module non activé')}

function cashRecapRows(r){const rows=[];

  const ses=(S.cashSessions||[]).filter(c=>c.opened===d&&c.closing);const hist=!ses.length?(S.cashHistory||[]).filter(h=>h.opened===d):[];
  const gap=ses.length?ses.reduce((a,c)=>a+c.closing.gap,0):hist.length?hist.reduce((a,h)=>a+h.gap,0):null;
  const row={d,n:sales.length,ttc:sales.reduce((a,x)=>a+x.total,0),esp:m('Espèces'),carte:m('Carte'),vir:m('Virement'),chq:m('Chèque'),adv,ref,dep,gap,closed:ses.length+hist.length>0};

 ${rows.length?`<tr style="font-weight:700"><td>Total</td>${cells({n:t('n'),ttc:t('ttc'),esp:t('esp'),carte:t('carte'),vir:t('vir'),chq:t('chq'),ref:t('ref'),enc:t('enc'),dep:t('dep')})}<td class="r num nw">${g.length?fmtM(g.reduce((a,r)=>a+r.gap,0)):'—'}</td></tr>`:''}</tbody></table></div>`}
function cashRecap(){const C=ui.cr;const r=cashRecapRange();const rows=cashRecapRows(r);const enc=rows.reduce((a,x)=>a+x.enc,0),dep=rows.reduce((a,x)=>a+x.dep,0);

/* ---------- Graphique en barres empilées (SVG, sans bibliothèque) ----------
   cols : [{lab, tip, cur, v:{clé:valeur}}] ; series : [{k, label, color}] */
function stackChart(cols,series,{H=220,unit='DT',fmt=fmtShort,valFmt=fmtM}={}){
 const tot=c=>series.reduce((a,s)=>a+(c.v[s.k]||0),0);
 const max=Math.max(...cols.map(tot),1);const step=niceStep(max);const top=Math.ceil(max/step)*step;
 const W=Math.max(1000,cols.length*24),L=48,B=24,T=10;const gw=(W-L-8)/Math.max(cols.length,1),bw=Math.min(28,gw*0.7);
 const y=v=>T+(H-T-B)*(1-v/top);
 let ticks='';for(let v=0;v<=top;v+=step)ticks+=`<line x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${fmt(v)}</text>`;
 const every=Math.ceil(cols.length/16);
 const bars=cols.map((c,i)=>{const cx=L+i*gw+gw/2;let acc=0;const segs=series.map(s=>{const v=c.v[s.k]||0;if(!v)return'';const y1=y(acc+v),h=y(acc)-y1;acc+=v;return `<rect x="${cx-bw/2}" y="${y1}" width="${bw}" height="${Math.max(0,h-1)}" rx="2" fill="${s.color}"><title>${esc(c.tip)} · ${esc(s.label)} : ${valFmt(v)}</title></rect>`}).join('');
  const lab=(i%every===0||c.cur)?`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="${c.cur?'var(--ink)':'var(--muted)'}" ${c.cur?'font-weight="600"':''}>${esc(c.lab)}</text>`:'';
  return `${c.cur?`<rect x="${L+i*gw+1}" y="${T}" width="${gw-2}" height="${H-B-T}" fill="var(--sage-tint)" rx="3"/>`:''}${segs}<rect x="${L+i*gw}" y="${T}" width="${gw}" height="${H-B-T}" fill="transparent"><title>${esc(c.tip)} · total ${valFmt(tot(c))}</title></rect>${lab}`}).join('');
 return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${Math.min(W,560)}px" role="img" aria-label="Graphique en ${unit}">${ticks}${bars}</svg></div>`}
const legendHTML=(series,totals,grand)=>`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.label)}${totals?` <b class="num">${fmtM(totals[s.k]||0)}</b>${grand?` <span class="muted">${pct(totals[s.k]||0,grand).toLocaleString('fr-FR')} %</span>`:''}`:''}</span>`).join('')}</div>`;

 const days=cols.filter(c=>c.n).length;const best=[...cols].sort((a,b)=>Object.values(b.v).reduce((x,y)=>x+y,0)-Object.values(a.v).reduce((x,y)=>x+y,0))[0];const bestV=best?Object.values(best.v).reduce((x,y)=>x+y,0):0;

/* ---------- Justificatifs : photo compressée, envoyée dans l'espace privé Supabase « justificatifs » ---------- */
function shrinkImage(file,maxSide=1800,q=.78){return new Promise(res=>{if(!/^image\//.test(file.type)||file.type==='image/gif'){res(file);return}
 const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,maxSide/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>res(b&&b.size<file.size?new File([b],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):file),'image/jpeg',q)};img.onerror=()=>{URL.revokeObjectURL(url);res(file)};img.src=url})}
async function attachFile(e,file){
 if(!file)return;if(file.size>15*1024*1024){toast('Fichier trop lourd (15 Mo maximum).',true);return}
 const f=await shrinkImage(file);const n=expFiles(e).length+1;const ext=(f.type==='application/pdf'?'pdf':f.type==='image/png'?'png':'jpg');
 const path=`${e.date.slice(0,4)}/${e.date.slice(5,7)}/${e.no.replace(/[^\w-]/g,'_')}-${n}.${ext}`;
 const entry={path,name:file.name,type:f.type,size:f.size,at:TODAY+' '+hm(nowMin()),user:ui.user.id};
 if(Store.PROD){if(!Store.client||!navigator.onLine){toast('Hors ligne : joignez la photo plus tard depuis la dépense.',true);return}
  const {error}=await Store.client.storage.from('justificatifs').upload(path,f,{contentType:f.type,upsert:isAdmin()});
  if(error){toast('Photo non envoyée : '+(/bucket|not found/i.test(error.message)?'espace « justificatifs » à créer dans Supabase (voir README).':error.message),true);return}}
 else entry.demo=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
 e.files=[...expFiles(e),entry];if(!e.justif)e.justif='Facture';e.attach=true;log('Justificatif joint',`${e.no} · ${file.name}`);toast('Justificatif archivé pour '+e.no+'.');render()}
async function openFile(entry){
 if(entry.demo){const w=window.open();if(w)w.document.write(entry.type==='application/pdf'?`<iframe src="${entry.demo}" style="border:0;width:100%;height:100vh"></iframe>`:`<img src="${entry.demo}" style="max-width:100%">`);return}
 if(!Store.PROD||!Store.client){toast('Fichier disponible uniquement dans l\'application connectée.',true);return}
 const w=window.open('','_blank');const {data,error}=await Store.client.storage.from('justificatifs').createSignedUrl(entry.path,600);
 if(error){if(w)w.close();toast('Ouverture impossible : '+error.message,true);return}if(w)w.location=data.signedUrl;else location.href=data.signedUrl}

/* ---------- Export Excel (.xlsx) sans bibliothèque : classeur zippé, une feuille par tableau ---------- */
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
function zipStore(files){const enc=new TextEncoder();const parts=[],cen=[];let off=0;
 for(const [name,str] of files){const nb=enc.encode(name),data=enc.encode(str),crc=crc32(data);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nb.length,true);
  parts.push(new Uint8Array(h.buffer),nb,data);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);
  cen.push(new Uint8Array(c.buffer),nb);off+=30+nb.length+data.length}
 const cs=cen.reduce((a,x)=>a+x.length,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
const xEsc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
const colName=i=>{let s='';i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
/* sheets : [{name, rows:[[...]]}] ; un nombre devient une cellule numérique ; {m:millimes} devient un montant en DT */
function xlsxBlob(sheets){
 const cell=(v,r,c)=>{const ref=colName(c)+(r+1);if(v&&typeof v==='object'&&'m' in v)return `<c r="${ref}" s="2"><v>${(v.m/1000).toFixed(3)}</v></c>`;if(typeof v==='number'&&isFinite(v))return `<c r="${ref}"><v>${v}</v></c>`;if(v===null||v===undefined||v==='')return '';return `<c r="${ref}" t="inlineStr"${r===0?' s="1"':''}><is><t xml:space="preserve">${xEsc(v)}</t></is></c>`};
 const sheetXml=sh=>{const w=sh.rows[0]?sh.rows[0].map((_,c)=>Math.min(48,Math.max(10,...sh.rows.map(row=>String(row[c]&&row[c].m!==undefined?fmtM(row[c].m):row[c]??'').length+2)))):[];
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>${w.length?`<cols>${w.map((x,i)=>`<col min="${i+1}" max="${i+1}" width="${x}" customWidth="1"/>`).join('')}</cols>`:''}<sheetData>${sh.rows.map((row,r)=>`<row r="${r+1}">${row.map((v,c)=>cell(v,r,c)).join('')}</row>`).join('')}</sheetData></worksheet>`};
 const names=sheets.map((s,i)=>xEsc(String(s.name).replace(/[\\\/?*\[\]:]/g,' ').slice(0,31)||'Feuille'+(i+1)));
 const files=[['[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`],
  ['_rels/.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
  ['xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${names.map((n,i)=>`<sheet name="${n}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`],
  ['xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
  ['xl/styles.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0.000"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`],
  ...sheets.map((s,i)=>[`xl/worksheets/sheet${i+1}.xml`,sheetXml(s)])];
 return zipStore(files)}

function comptaData(m){
 const r={from:m+'-01',to:minD(lastOfMonth(m+'-01'),TODAY)};
 const sales=liveSales().filter(s=>inRange(s.date,r));const lines=sales.flatMap(s=>s.lines);
 const ttc=sales.reduce((a,s)=>a+s.total,0),ht=docHT(lines),tva=ttc-ht;
 const byVolet={};lines.forEach(l=>{const k=volet(l.cat);const o=byVolet[k]=byVolet[k]||{ht:0,tva:0,ttc:0};o.ht+=lineHT(l);o.tva+=lineTVA(l);o.ttc+=lineTotal(l)});
 const byMethod={};S.payments.filter(p=>inRange(p.date,r)&&p.method!==ADV).forEach(p=>{byMethod[p.method]=(byMethod[p.method]||0)+p.amount});S.advances.filter(a=>inRange(a.date,r)).forEach(a=>{byMethod[a.method]=(byMethod[a.method]||0)+a.amount});
 const advRef=S.advances.reduce((x,a)=>x+a.refunds.filter(f=>inRange(f.date,r)).reduce((y,f)=>y+f.amount,0),0);
 const exps=liveExp().filter(e=>inRange(e.date,r)).sort((a,b)=>a.date.localeCompare(b.date));const dep=exps.reduce((a,e)=>a+e.amount,0);
 const byCat={};exps.forEach(e=>{byCat[e.cat]=(byCat[e.cat]||0)+e.amount});
 const closings=[...(S.cashHistory||[])].filter(h=>inRange(h.opened,r)).sort((a,b)=>a.opened.localeCompare(b.opened));
 const invs=S.invoices.filter(i=>inRange(i.date,r));
 return {r,sales,lines,ttc,ht,tva,byVolet,byMethod,advRef,exps,dep,byCat,closings,invs}}

function clientAnalysis(months){
 const to=TODAY,from=months==='annee'?TODAY.slice(0,4)+'-01-01':shiftMonth(TODAY,-months);const r={from,to};
 const span=daysDiff(from,to)+1;const prev={from:addDays(from,-span),to:addDays(from,-1)};
 const all=liveSales().filter(s=>s.clientId);const inP=all.filter(s=>inRange(s.date,r));
 const firstBuy={};all.forEach(s=>{if(!firstBuy[s.clientId]||s.date<firstBuy[s.clientId])firstBuy[s.clientId]=s.date});
 const lastBuy={};all.forEach(s=>{if(!lastBuy[s.clientId]||s.date>lastBuy[s.clientId])lastBuy[s.clientId]=s.date});
 const by={};inP.forEach(s=>{const o=by[s.clientId]=by[s.clientId]||{id:s.clientId,ca:0,n:0,days:new Set(),vol:{},hours:[]};o.ca+=s.total;o.n++;o.days.add(s.date);s.lines.forEach(l=>{const k=volet(l.cat);o.vol[k]=(o.vol[k]||0)+lineTotal(l)})});
 const rows=Object.values(by).map(o=>({...o,visits:o.days.size,basket:Math.round(o.ca/o.n),last:lastBuy[o.id],fav:Object.entries(o.vol).sort((a,b)=>b[1]-a[1])[0][0],acts:Object.keys(o.vol).length})).sort((a,b)=>b.ca-a.ca);
 const prevIds=new Set(all.filter(s=>inRange(s.date,prev)).map(s=>s.clientId));const back=[...prevIds].filter(id=>by[id]).length;
 const fresh=rows.filter(o=>firstBuy[o.id]>=from).length;
 // segments sur tout l'historique
 const visitsAll={};all.forEach(s=>{(visitsAll[s.clientId]=visitsAll[s.clientId]||new Set()).add(s.date)});
 const seg={champions:[],fideles:[],relancer:[],perdus:[],nouveaux:[]};
 Object.keys(lastBuy).forEach(id=>{const v=visitsAll[id].size,last=lastBuy[id],ago=daysDiff(last,TODAY);const spent=all.filter(s=>s.clientId===id).reduce((a,s)=>a+s.total,0);
  if(firstBuy[id]>=addDays(TODAY,-30))seg.nouveaux.push(id);else if(ago>120)seg.perdus.push(id);else if(ago>45&&v>=2)seg.relancer.push(id);else if(v>=6&&ago<=30)seg.champions.push(id);else if(v>=3)seg.fideles.push(id)});
 const dowC=[0,0,0,0,0,0,0];const hourC={};inP.forEach(s=>{dowC[dow(s.date)]++;const h=+(s.time||'12').slice(0,2);hourC[h]=(hourC[h]||0)+1});
 const volClients={};rows.forEach(o=>Object.keys(o.vol).forEach(k=>{volClients[k]=(volClients[k]||0)+1}));
 return {r,prev,rows,back,prevN:prevIds.size,fresh,seg,dowC,hourC,volClients,ca:rows.reduce((a,o)=>a+o.ca,0),n:inP.length,anon:liveSales().filter(s=>!s.clientId&&inRange(s.date,r)).length}}

/* Éléments de paie du mois (le mois civil ; les jours à venir sont comptés selon l'horaire prévu) */
function payrollData(month){const from=month+'-01',to=lastOfMonth(from);
 return staffList('salarié').map(m=>{let planned=0,present=0,mins=0,late=0;const cnt={};const h=m.hours||DEF_HOURS;
  for(let d=from;d<=to;d=addDays(d,1)){if(m.start&&d<m.start)continue;const p=presOf(m.id,d);const work=worksOn(m,d);if(work)planned++;
   if(p){cnt[p.status]=(cnt[p.status]||0)+1;if(['présent','retard'].includes(p.status)){present++;mins+=presHours(p);if(p.status==='retard'||(tMin(p.in)!==null&&tMin(p.in)>tMin(h.in)+10))late++}}
   else if(work&&d>TODAY){present++;mins+=presHours({status:'présent',...h})}}
  const inM=e=>e.date>=from&&e.date<=to;const av=teamEv(m.id,'avance').filter(e=>inM(e)&&expOk(e.expenseId)).reduce((a,e)=>a+e.amount,0);
  const ret=teamEv(m.id,'remboursement').filter(e=>inM(e)&&e.method==='Retenue sur salaire').reduce((a,e)=>a+e.amount,0);const rbCash=teamEv(m.id,'remboursement').filter(e=>inM(e)&&e.method!=='Retenue sur salaire').reduce((a,e)=>a+e.amount,0);
  const missing=[];for(let d=from;d<=minD(to,TODAY);d=addDays(d,1)){if((!m.start||d>=m.start)&&worksOn(m,d)&&!presOf(m.id,d))missing.push(d)}
  return {m,planned,present,mins,late,cp:cnt['congé payé']||0,anp:cnt['absence non payée']||0,mal:cnt['maladie']||0,aj:cnt['absence justifiée']||0,fer:cnt['férié']||0,av,ret,rbCash,bal:advBalance(m.id),missing}})}

 <div class="row"><select class="input" data-in="teamm" id="team-m" style="width:auto">${months.map(x=>`<option value="${x}" ${x===M?'selected':''}>${MOIS[+x.slice(5,7)-1]} ${x.slice(0,4)}</option>`).join('')}</select><button class="btn" data-a="printPayroll">${ic('print')}Imprimer</button><button class="btn" data-a="xlsxPayroll">${ic('dl')}Excel</button><button class="btn primary" data-a="mailPayroll">${ic('mail')}Envoyer au comptable</button></div></div>

 <p class="note" style="margin-top:8px">« À retenir » : remboursements d'avance à déduire du salaire du mois. « Solde avances » : reste dû à ce jour, toutes périodes.</p></div>`}

function viewVentes(){
 const V=ui.sales,q=V.q.trim().toLowerCase();
 const months=[...new Set(liveSales().map(s=>s.date.slice(0,7)).concat([TODAY.slice(0,7)]))].sort().reverse();
 const mLabel=m=>new Intl.DateTimeFormat('fr-FR',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(m+'-15T12:00:00Z'));
 const pays=s=>S.payments.filter(p=>p.saleId===s.id);
 let rows=S.sales.filter(s=>V.month==='tous'||s.date.startsWith(V.month));
 rows=rows.filter(s=>!q||(s.no+' '+cname(s.clientId)+' '+s.lines.map(l=>l.name).join(' ')+' '+(s.seller||'')).toLowerCase().includes(q));
 if(V.method!=='tous')rows=rows.filter(s=>pays(s).some(p=>p.method===V.method));
 rows.sort((a,b)=>(b.date+b.time+b.no).localeCompare(a.date+a.time+a.no));
 const live=rows.filter(s=>s.status!=='annulée');
 const tot=live.reduce((a,s)=>a+s.total,0),paid=live.reduce((a,s)=>a+paidFor(s.id),0);
 const byM={};live.forEach(s=>pays(s).forEach(p=>{byM[p.method]=(byM[p.method]||0)+p.amount}));
 const per=25,pages=Math.max(1,Math.ceil(rows.length/per));V.page=Math.min(V.page,pages);const slice=rows.slice((V.page-1)*per,V.page*per);
 const kpi=(l,v,s2)=>`<div class="kpi"><div class="eyebrow">${l}</div><div class="v num">${v}</div><div class="s">${s2}</div></div>`;
 const methods=['tous',...METHODS,ADV];
 return `<div class="head"><div><h1>Ventes</h1><p>Toutes les ventes, ticket par ticket. Cliquez sur une ligne pour revoir le ticket.</p></div>

 ${salesChart(V.month)}
 <div class="kpis">${kpi('Tickets',live.length,rows.length-live.length?(rows.length-live.length)+' annulé(s) non comptés':'Ventes validées')}${kpi('Total des ventes TTC',fmtM(tot),'HT '+fmtM(live.reduce((a,s)=>a+docHT(s.lines),0)))}${kpi('Encaissé',fmtM(paid),Object.entries(byM).map(([m,v])=>m+' '+fmtShort(v)).join(' · ')||'—')}${kpi('Reste à encaisser',fmtM(tot-paid),live.filter(s=>s.total>paidFor(s.id)).length+' vente(s) non soldée(s)')}</div>
 <div class="card"><div class="card-h"><div class="search" style="width:min(320px,100%)">${ic('search')}<input class="input" id="sales-q" data-in="salesq" placeholder="Cliente, n° de ticket, prestation, vendeuse" value="${esc(V.q)}"></div>
  <div class="chips">${methods.map(m=>`<button class="chip ${V.method===m?'on':''}" data-a="salesmethod" data-m="${m}">${m==='tous'?'Tous moyens':m}</button>`).join('')}</div></div>
 <div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Ticket</th><th>Cliente</th><th>Articles</th><th class="r">Total TTC</th><th class="r">Payé</th><th>Moyen</th><th>Vendu par</th><th>État</th></tr></thead><tbody>
 ${slice.map(s=>{const pd=paidFor(s.id);const ms=[...new Set(pays(s).map(p=>p.method))].join(', ')||'—';const st=s.status==='annulée'?'<span class="pill p-neutral">Annulée</span>':pd>=s.total?'<span class="pill p-good">Soldée</span>':pd>0?'<span class="pill p-warn">Partielle</span>':'<span class="pill p-crit">Non payée</span>';
  return `<tr class="click" data-a="viewsale" data-id="${s.id}"><td class="num nw">${fmtD(s.date)}</td><td class="num nw">${esc(s.no)}</td><td>${esc(cname(s.clientId))}</td><td>${s.lines.map(l=>`<div><span class="v-${volet(l.cat)}"><span class="vdot"></span></span>${esc(l.name)}${l.qty>1?' × '+l.qty:''}</div>`).join('')}</td><td class="r num nw">${fmtM(s.total)}</td><td class="r num nw" style="${pd<s.total?'color:var(--terra);font-weight:600':''}">${fmtM(pd)}</td><td>${esc(ms)}</td><td>${esc(s.seller||userName(s.user))}</td><td>${st}</td></tr>`}).join('')||'<tr><td colspan="9" class="muted">Aucune vente pour ce filtre.</td></tr>'}
 </tbody></table></div>
 <div class="pager"><span>${rows.length} ticket${rows.length>1?'s':''}</span><span class="row"><button class="btn sm" data-a="salespage" data-d="-1" ${V.page<=1?'disabled':''} aria-label="Page précédente">${ic('chev')}</button>Page ${V.page} / ${pages}<button class="btn sm" data-a="salespage" data-d="1" ${V.page>=pages?'disabled':''} aria-label="Page suivante">${ic('chevr')}</button></span></div></div>`;
}
